name: Deploy to GitHub Pages

# Deployment is deliberately NOT triggered by pushes.
#
# Pushing to `main` must remain cheap and safe: the branch ruleset requires the
# "AI attribution policy" check, so that check still runs on every push and
# still gates the branch. Publishing, by contrast, is a product decision that
# happens only once a change is proven complete locally -- so it is manual.
#
# To publish: `gh workflow run "Deploy to GitHub Pages" --ref main`
# (or use the "Run workflow" button on the Actions tab).
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install release package
        run: python3 -m pip install .

      - name: Verify installed resources and public bundle
        run: python3 scripts/verify_release_install.py

      - name: Prepare static site
        run: python3 scripts/prepare_pages_site.py _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
