// ── Pretext letter body ───────────────────────────────────────────────
const LETTER_FONT='13px "Times New Roman", Times, serif', LETTER_LH=21;
let _resizeObs=null,_prepared=null,_preparedText='';
function renderBody(text,el){
  if(!prepareWithSegments||!layoutWithLines){
    el.classList.add('fallback');
    el.textContent=text;
    requestAnimationFrame(()=>{
      const lh=parseFloat(getComputedStyle(el).lineHeight)||LETTER_LH;
      _lineCount=Math.max(text.split('\n').length,Math.round(el.scrollHeight/lh));
      _updateLineCt();
    });
    return;
  }
  el.classList.remove('fallback');
  const w=el.clientWidth;if(!w)return;
  if(text!==_preparedText){
    _prepared=prepareWithSegments(text,LETTER_FONT,{whiteSpace:'pre-wrap'});
    _preparedText=text;
  }
  const layout=layoutWithLines(_prepared,w,LETTER_LH);
  const{lines}=layout;
  _lineCount=lines.length;
  const frag=document.createDocumentFragment();
  for(let i=0;i<lines.length;i++){
    const line=lines[i];
    const isLast=i===lines.length-1;
    try{
      const startSeg=line.start.segmentIndex,endSeg=line.end.segmentIndex;
      const segs=_prepared.segments.slice(startSeg,endSeg+1);
      const kinds=_prepared.kinds.slice(startSeg,endSeg+1);
      const widths=_prepared.widths.slice(startSeg,endSeg+1);
      const wordCount=kinds.filter(k=>k==='text').length;
      const spaceCount=kinds.filter(k=>k==='space').length;
      if(!isLast&&wordCount>1&&spaceCount>0){
        // Justified line: distribute extra space across inter-word gaps
        const wordWidthSum=widths.reduce((s,ww,j)=>kinds[j]==='text'?s+ww:s,0);
        const extraPerSpace=(w-wordWidthSum)/spaceCount;
        if(extraPerSpace>=0){
          const d=document.createElement('div');d.className='ll ll-j';
          for(let j=0;j<segs.length;j++){
            const sp=document.createElement('span');
            if(kinds[j]==='space'){
              sp.className='sp';
              sp.style.width=(widths[j]+extraPerSpace)+'px';
              sp.textContent=' ';
            }else{
              sp.textContent=segs[j];
            }
            d.appendChild(sp);
          }
          frag.appendChild(d);
          continue;
        }
      }
    }catch(_){}
    // Fallback: plain left-aligned line
    const d=document.createElement('div');d.className='ll';d.textContent=line.text;
    frag.appendChild(d);
  }
  el.replaceChildren(frag);
  _updateLineCt();
}
function _updateLineCt(){
  const lc=document.getElementById('lm-linect');
  if(!lc)return;
  if(_lineCount>20){lc.textContent=`${_lineCount} lines`;lc.style.display='';}
  else{lc.textContent='';lc.style.display='none';}
}
function _setupProgress(bodyEl){
  if(_progressScrollOff){_progressScrollOff();_progressScrollOff=null;}
  const bar=document.getElementById('lm-progress');
  if(!bar)return;
  const onScroll=()=>{
    const p=bodyEl.scrollHeight<=bodyEl.clientHeight?0
      :bodyEl.scrollTop/(bodyEl.scrollHeight-bodyEl.clientHeight);
    bar.style.transform=`scaleX(${p})`;
  };
  bodyEl.addEventListener('scroll',onScroll);
  _progressScrollOff=()=>bodyEl.removeEventListener('scroll',onScroll);
  onScroll();
}
function setupResize(el){
  if(_resizeObs){_resizeObs.disconnect();_resizeObs=null;}
  _resizeObs=new ResizeObserver(()=>{if(curMsg)renderBody(curMsg.body||'',el);});
  _resizeObs.observe(el);
}
function teardownResize(){
  if(_resizeObs){_resizeObs.disconnect();_resizeObs=null;}
  _prepared=null;_preparedText='';
  clearCache();
  if(_progressScrollOff){_progressScrollOff();_progressScrollOff=null;}
  const bar=document.getElementById('lm-progress');
  if(bar)bar.style.transform='scaleX(0)';
}

// ── Helpers ───────────────────────────────────────────────────────────
function fmtDate(iso){
  try{return new Date(iso+'T00:00:00').toLocaleDateString(undefined,
    {year:'numeric',month:'long',day:'numeric'});}catch(_){return iso;}
}
function _humanizeGiftId(id){
  if(!id)return 'memory';
  return id.replace(/_/g,' ').replace(/\b\w/g,m=>m.toUpperCase()).replace(/\bA\b /,'a ');
}
function giftLabel(gift){
  if(!gift)return 'a memory';
  if(gift.type==='nudge')return 'a note in the garden';
  const namedAnimal=gift.type==='animal'&&(gift.animal_name||gift.catalog_id);
  const base=namedAnimal||gift.catalog_id||gift.type||'memory';
  const label=_humanizeGiftId(base).toLowerCase();
  if(/^a |^an /.test(label))return label;
  const article=/^[aeiou]/i.test(label)?'an':'a';
  return `${article} ${label}`;
}
function htmlEsc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
  .replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

// ── Arc seeding (?arc= URL param — browser demo harness §24 step 11a Part B) ──
async function _arcSeed(arc){
  if(!arc||!bundle)return;
  const bid=bundle.bundle_id;
  const msgs=bundle.messages||[];
  const gifts=bundle.garden_gifts||[];
  const ag=gifts.find(g=>g.type==='animal');
  const actionMap={0:0,1:3,2:7,3:14};
  if(arc==='postcomplete'){
    // Mark all messages read; trigger all gifts; bond the animal
    for(const m of msgs){readIds.add(m.id);await kvSet(kRead(bid,m.id),'1');}
    for(const g of gifts){giftDiscovered[g.id]=true;await kvSet(kGift(bid,g.id),'1');}
    if(ag){animalTrustActions=14;animalTier=3;animalTriggered=true;
      await kvSet(kAnimal(bid),JSON.stringify({trust_actions:14}));}
  }else if(/^trust[123]$/.test(arc)){
    const tier=parseInt(arc[5]);
    const actions=actionMap[tier]??3;
    if(ag){
      giftDiscovered[ag.id]=true;await kvSet(kGift(bid,ag.id),'1');
      animalTrustActions=actions;animalTier=tier;animalTriggered=true;
      await kvSet(kAnimal(bid),JSON.stringify({trust_actions:actions}));
    }
  }else if(arc==='item'){
    // Trigger non-animal gifts so `i · examine` appears
    for(const g of gifts){
      if(g.type!=='animal'){giftDiscovered[g.id]=true;await kvSet(kGift(bid,g.id),'1');}
    }
  }else if(arc==='waiting'){
    // Clear all state — fresh visit, no letters due (bundle should have future dates)
    for(const m of msgs){readIds.delete(m.id);await kvSet(kRead(bid,m.id),'');}
    for(const g of gifts){giftDiscovered[g.id]=false;await kvSet(kGift(bid,g.id),'');}
    visitCount=1;await kvSet(kVisits(bid),'1');
  }
  // delivery: no state change needed — loadBundle already set up fresh visit state
  // Sync in-memory animal state to garden renderer
  if(garden)garden.setAnimalData(_animalData());
}

}
function _devToggleGrid(){
  let ov=document.getElementById('dev-overlay');
  if(_devGridActive){
    _devGridActive=false;
    if(ov)ov.remove();
    if(_devGridRaf){cancelAnimationFrame(_devGridRaf);_devGridRaf=null;}
    return;
  }
  if(!ov){
    ov=document.createElement('div');ov.id='dev-overlay';
    ov.style.backgroundImage=
      `repeating-linear-gradient(to right,rgba(200,0,0,.1) 0,rgba(200,0,0,.1) 1px,transparent 1px,transparent ${CW*10}px),`+
      `repeating-linear-gradient(to bottom,rgba(200,0,0,.1) 0,rgba(200,0,0,.1) 1px,transparent 1px,transparent ${CH*10}px)`;
    document.getElementById('g').appendChild(ov);
  }
  _devGridActive=true;
  let lastFps=0,_lastT=0,_frames=0;
  const modes=['default','white-bg','grayscale','bw-anim'];
  const tick=t=>{
    if(!_devGridActive)return;
    _devGridRaf=requestAnimationFrame(tick);
    _frames++;
    if(t-_lastT>=1000){lastFps=Math.round(_frames*1000/(t-_lastT));_frames=0;_lastT=t;}
    const s=garden?.state;
    const mr=s?.mouseRow??-1,mc=s?.mouseCol??-1;
    const cur=_devSeason||(getTimeOfDay()==='day'?getSeason():`${getSeason()}-${getTimeOfDay()}`);
    const ad=s?.animalData;
    const anStr=ad?`${ad.type}/${ad.tier}`:'none';
    const anDbg=garden?.animalDebugState?.()||'none';
    ov.textContent=
      `${s?.cols||0}x${s?.rows||0} | CW=${CW.toFixed(2)} CH=${CH.toFixed(1)} | mouse(${mc},${mr}) | FPS:${lastFps}\n`+
      `season: ${cur}  color: ${modes[_colorMode]||_colorMode}  animal: ${anStr}  behavior: ${anDbg}\n`+
      `  ,/. season+time   Shift+A animal   Shift+B color\n`+
      `  Shift+D dump   Shift+G grid (this)   f feed   Shift+R react\n`+
      `  Shift+P post-cmp   Shift+F first-run   Shift+I gift   Shift+V visit   Shift+N birds`;
  };
  _devGridRaf=requestAnimationFrame(tick);
}

// ── Event wiring ──────────────────────────────────────────────────────
function wire(){
  const dz=document.getElementById('drop-zone'),fi=document.getElementById('file-input');
  dz.addEventListener('dragover',e=>{e.preventDefault();dz.classList.add('over');});
  dz.addEventListener('dragleave',()=>dz.classList.remove('over'));
  dz.addEventListener('drop',e=>{e.preventDefault();dz.classList.remove('over');handleFile(e.dataTransfer.files[0]);});
  dz.addEventListener('click',e=>{if(e.target.id!=='btn-browse')fi.click();});
  dz.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();fi.click();}});
  document.getElementById('btn-browse').onclick=e=>{e.stopPropagation();fi.click();};
  fi.onchange=e=>handleFile(e.target.files[0]);

  // Demo letter download + auto-load
  document.getElementById('btn-demo').onclick=async e=>{
    e.stopPropagation();
    try{
      const resp=await fetch('test_fixture.lateletter');
      if(!resp.ok)throw new Error('fetch failed');
      const text=await resp.text();
      const blob=new Blob([text],{type:'application/json'});
      // Auto-load it directly
      const file=new File([blob],'demo.lateletter',{type:'application/json'});
      await handleFile(file);
    }catch(err){
      // Fallback: trigger download so user can upload manually
      const a=document.createElement('a');a.href='test_fixture.lateletter';
      a.download='demo.lateletter';a.click();
    }
  };

  // Sealed demo letter — real PBKDF2+AES-GCM gate (passcode required)
  document.getElementById('btn-demo-sealed').onclick=async e=>{
    e.stopPropagation();
    try{
      const resp=await fetch('sealed_demo.lateletter');
      if(!resp.ok)throw new Error('fetch failed');
      const blob=new Blob([await resp.text()],{type:'application/json'});
      await handleFile(new File([blob],'sealed_demo.lateletter',{type:'application/json'}));
    }catch(err){
      const a=document.createElement('a');a.href='sealed_demo.lateletter';
      a.download='sealed_demo.lateletter';a.click();
    }
  };

  document.getElementById('btn-unlock').onclick=handleUnlock;
  document.getElementById('btn-pp-back').onclick=showGarden;
  document.getElementById('pp-input').addEventListener('keydown',e=>{if(e.key==='Enter')handleUnlock();});

  document.getElementById('btn-sel-back').onclick=showArchive;

  document.getElementById('btn-save').onclick=saveToText;
  document.getElementById('btn-all').onclick=showArchive;
  document.getElementById('btn-rd-back').onclick=()=>{
    if(_firstReadGuide){
      _firstReadGuide=false;
      const goNext=dueIdxs.length>0?showLetterSelect:showArchive;
      showStatus('letters will arrive here on special days.','come back anytime.',
        [{label:dueIdxs.length>0?'next letter':'your letters',hi:true,fn:goNext}]);
    }else if(dueIdxs.length>0){showLetterSelect();}
    else{showArchive();}
  };

  document.getElementById('btn-arc-back').onclick=showGarden;
  document.getElementById('btn-close-mem').onclick=closeMemory;
  document.getElementById('modal-mem').addEventListener('click',e=>{
    if(e.target===document.getElementById('modal-mem'))closeMemory();});
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape')closeMemory();
    // f = feed animal (authenticated, triggered, not yet bonded)
    if(e.key==='f'&&cachedPassphrase!==null&&animalType&&animalTriggered&&animalTier<3){
      e.preventDefault();feedAnimal();}
    // Shift+A = dev: cycle animal types/tiers (dev fixture only)
    if(e.key==='A'&&isDevFixture){e.preventDefault();devCycleAnimal();}
    // ── Dev-only keys (all gated) ──────────────────────────────────
    if(!isDevFixture)return;
    // Shift+R : trigger feed reaction without mutating trust
    if(e.key==='R'){
      e.preventDefault();
      const ad=garden?.state?.animalData;
      if(ad&&ad.triggered){
        garden.triggerAnimalFeedReaction({type:ad.type,tier:ad.tier});
        console.log('[dev] feed reaction →',ad.type,ad.tier);
      }else{
        console.log('[dev] no active animal to react');
      }
    }
    // Shift+N : spawn ambient bird burst
    if(e.key==='N'){
      e.preventDefault();
      if(garden){
        garden.spawnAmbientBirdBurst();
        console.log('[dev] ambient birds spawned');
      }
    }
    // < / > : cycle seasons + time-of-day at runtime
    if(e.key===','||e.key==='.'){
      e.preventDefault();
      const states=['spring','spring-evening','spring-night','summer','summer-evening','summer-night','autumn','autumn-evening','autumn-night','winter','winter-evening','winter-night'];
      const cur=_devSeason||(getTimeOfDay()==='day'?getSeason():`${getSeason()}-${getTimeOfDay()}`);
      const idx=(states.indexOf(cur)+(e.key==='.'?1:states.length-1))%states.length;
      _devSeason=states[idx];
      _devNight=_devSeason.endsWith('-night');
      if(garden){garden.dom._lastGy=-1;garden._reset();_refreshDevGridBg();}
      console.log('[dev] season →',_devSeason);
    }
    // Shift+D : dump state to console
    if(e.key==='D'){
      e.preventDefault();
      console.log('[dev] state',{
        season:getSeason(),CW,CH,
        cols:garden?.state?.cols,rows:garden?.state?.rows,
        visitCount,animalType,animalTier,animalTriggered,
        giftDiscovered:Object.keys(giftDiscovered).filter(k=>giftDiscovered[k]),
        postComplete,dueIdxs:dueIdxs.length,_colorMode
      });
    }
    // Shift+B : cycle color/background mode (0=default 1=white-bg 2=grayscale 3=bw-anim)
    if(e.key==='B'){e.preventDefault();_devCycleColorMode();}
    // Shift+G : toggle grid overlay
    if(e.key==='G'){e.preventDefault();_devToggleGrid();}
    // Shift+P : toggle post-complete state
    if(e.key==='P'){
      e.preventDefault();
      postComplete=!postComplete;
      if(garden)garden.setPostComplete(postComplete);
      console.log('[dev] postComplete →',postComplete);
    }
    // Shift+F : re-trigger first-run banner
    if(e.key==='F'){
      e.preventDefault();
      _frbDone=false;firstRun=true;
      startFirstRunBanner();
      console.log('[dev] first-run banner re-triggered');
    }
    // Shift+I : inject next undiscovered gift
    if(e.key==='I'){
      e.preventDefault();
      if(bundle){
        const g=(bundle.garden_gifts||[]).find(x=>!giftDiscovered[x.id]);
        if(g){giftDiscovered[g.id]=true;kvSet(kGift(bundle.bundle_id,g.id),'1');evalTriggers(null);console.log('[dev] gift discovered:',g.id,g.type);}
        else console.log('[dev] all gifts already discovered');
      }
    }
    // Shift+V : simulate additional visit (increments visitCount + re-evals triggers)
    if(e.key==='V'){
      e.preventDefault();
      visitCount++;
      if(bundle)kvSet(kVisits(bundle.bundle_id),String(visitCount));
      evalTriggers(null);
      console.log('[dev] visitCount →',visitCount);
    }
  });
  window.addEventListener('pagehide',()=>{cachedPassphrase=null;});
  window.addEventListener('resize',()=>{if(garden)garden.onResize();_refreshDevGridBg();});
}

// ── Init ──────────────────────────────────────────────────────────────
// URL-shareable letters: ?l=<name> fetches public_letters/<name>.lateletter
// from this same origin. The bundle sits in a public repo, so its body is
// only as private as its encryption — real sealed bundles only.
async function loadUrlLetter(){
  const name=new URLSearchParams(location.search).get('l');
  if(!name)return;
  try{
    if(!/^[a-z0-9_-]{1,64}$/i.test(name))
      throw new Error('that letter name is not valid.');
    const resp=await fetch(`public_letters/${name}.lateletter`);
    if(!resp.ok)throw new Error('no letter with that name lives here.');
    const blob=new Blob([await resp.text()],{type:'application/json'});
    await handleFile(new File([blob],`${name}.lateletter`,{type:'application/json'}));
  }catch(err){
    document.getElementById('err-h').textContent='could not open this letter';
    document.getElementById('err-d').textContent=err.message;
    showScreen('error');
  }
}

async function init(){
  await initTextLayout();
  try{
    garden=new GardenEngine(document.getElementById('g'));
    garden._reset();
    garden.start();
  }catch(e){console.error('[init] garden failed:',e);}
  try{await storageInit();}catch(e){console.error('[init] storage failed:',e);}
  wire();
  await loadUrlLetter();
}

init().catch(e=>console.error('[init] fatal:',e));
</script>
