<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LateLetter</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --text: #000000;
      --bg:   #f9f8f5;
      --scrim-bg: rgba(249, 248, 245, .76);
      --sans: 'Times New Roman', Times, serif;
    }

    html, body {
      width: 100%; height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      font-size: 15px;
      line-height: 1.65;
      overflow: hidden;
    }

    /* ── Garden: DOM text, scales with zoom ── */
    #g {
      position: fixed; inset: 0;
      overflow: hidden;
      font: 13px/15px 'Courier New', Courier, monospace;
      cursor: crosshair;
      transition: opacity .4s;
      user-select: none; -webkit-user-select: none;
      /* background set dynamically via setGroundBg() */
      background: var(--bg);
    }
    #g > div { white-space: pre; height: 15px; overflow: hidden; }

    /* ── Screen overlays ── */
    .screen {
      position: fixed; inset: 0;
      display: none; flex-direction: column;
      align-items: center; justify-content: center;
      z-index: 10; padding: 2rem;
      pointer-events: none;
    }
    .screen.active { display: flex; }

    /* Only inner cards capture pointer events — wrapper stays transparent to garden clicks */
    .scrim, .inbox, .welcome-inner { pointer-events: auto; }

    .scrim {
      background: var(--scrim-bg);
      backdrop-filter: blur(10px) contrast(.95);
      -webkit-backdrop-filter: blur(10px) contrast(.95);
      padding: 1.75rem 2rem;
      width: min(560px, 96vw);
      max-height: 88vh;
      overflow-y: auto;
    }

    /* ── Typography — opacity only ── */
    .t1  { color: var(--text); opacity: 1;    font-size: 1rem;   }
    .t2  { color: var(--text); opacity: .55;  font-size: .85rem; }
    .t3  { color: var(--text); opacity: .35;  font-size: .75rem; letter-spacing: .06em; }
    .t4  { color: var(--text); opacity: .2;   font-size: .72rem; }

    /* ── [bracket] buttons ── */
    .btn {
      background: none; border: none;
      font: inherit; font-size: .85rem;
      color: var(--text); opacity: .35;
      cursor: pointer; padding: 0;
      transition: opacity .12s; letter-spacing: .02em;
    }
    .btn::before { content: '['; }
    .btn::after  { content: ']'; }
    .btn:hover   { opacity: 1; }
    .btn.hi      { opacity: .8; }
    .btn-row     { display: flex; gap: 1.75rem; flex-wrap: wrap; }

    /* ── Underline inputs ── */
    .fi {
      width: 100%; background: transparent;
      border: none; border-bottom: 1px solid rgba(0,0,0,.2);
      color: var(--text); font: inherit; font-size: 1rem;
      padding: .35rem 0; margin-bottom: 1.4rem; outline: none;
    }
    .fi:focus { border-bottom-color: rgba(0,0,0,.5); }

    /* ── Welcome ── */
    /* Restore full-viewport pointer events so drag-drop works anywhere on screen */
    #s-welcome.active { pointer-events: auto; }
    #s-welcome { background: none; }
    .welcome-inner { text-align: center; }
    .welcome-inner p { margin-bottom: .5rem; }
    #drop-zone { padding: 3rem 4rem; cursor: pointer; }
    #drop-zone.over * { opacity: 1 !important; }
    #file-input { display: none; }

    /* ── HUD ── */
    #hud {
      position: fixed; bottom: 40%; left: 50%;
      transform: translateX(-50%);
      text-align: center; z-index: 5;
      white-space: nowrap; opacity: 0;
      transition: opacity 1.4s ease; pointer-events: none;
    }
    #hud.vis { opacity: 1; pointer-events: auto; }
    #hud-author { margin-bottom: .6rem; }
    #hud-btns   { display: flex; gap: 1.75rem; justify-content: center; }

    /* ── Passphrase ── */
    #s-passphrase .scrim { max-width: 440px; }
    .pp-title { margin-bottom: .2rem; }
    .pp-sub   { margin-bottom: 1.6rem; }
    .pp-label { margin-bottom: .3rem; }
    .pp-hint  { margin-bottom: 1.2rem; }
    .pp-err   { color: var(--text); opacity: .5; margin-bottom: .8rem; display: none; font-size: .82rem; }
    .pp-err.on { display: block; }
    .pp-info  { opacity: .3; font-size: .82rem; margin-bottom: .8rem; display: none; }
    .pp-info.on { display: block; }
    .warn-st  { opacity: .25; font-size: .78rem; margin-bottom: 1rem; display: none; }
    .warn-st.on { display: block; }

    /* ── Status ── */
    #s-status .scrim { max-width: 420px; text-align: center; }
    .st-h   { margin-bottom: .4rem; }
    .st-sub { margin-bottom: 1.4rem; }
    #st-btns { justify-content: center; }

    /* ── Letter select ── */
    #s-select .scrim { max-width: 420px; }
    .pick-list  { list-style: none; margin-bottom: 1.25rem; }
    .pick-list li { padding: .5rem 0; }
    .pick-btn {
      background: none; border: none; font: inherit; font-size: .9rem;
      color: var(--text); opacity: .55; cursor: pointer; padding: 0; text-align: left;
    }
    .pick-btn:hover { opacity: 1; }

    /* ── Reading ── */
    #s-reading { padding: 10vh 2rem 2rem; justify-content: flex-start; align-items: flex-start; }
    #s-reading .scrim {
      width: min(520px, 88vw);
      display: flex; flex-direction: column; max-height: 72vh;
    }
    .lm-from   { margin-bottom: .15rem; }
    .lm-label  { font-size: 1.1rem; margin-bottom: .15rem; }
    .lm-date   { margin-bottom: 1.5rem; }
    .letter-body {
      font-size: 13px; line-height: 1.65;
      color: var(--text); flex: 1; overflow-y: auto; margin-bottom: 1.5rem;
    }
    .letter-body.fallback { white-space: pre-wrap; }
    .letter-body .ll { white-space: pre; display: block; }
    .letter-body .ll-j { display: flex; align-items: baseline; white-space: nowrap; }
    .letter-body .ll-j .sp { flex-shrink: 0; }

    /* ── Reading progress ── */
    #lm-progress { height: 2px; background: var(--text); opacity: 0.15;
      transform: scaleX(0); transform-origin: left; transition: transform 0.1s;
      margin: 0 0 .6rem; }
    #lm-linect { font-size: .7rem; opacity: .2; }

    /* ── Inbox — transparent, floats over garden ── */
    #s-archive { background: none; }
    .inbox { width: min(340px, 92vw); }
    .inbox-title { margin-bottom: 1.8rem; }
    .inbox-list  { list-style: none; }
    .inbox-row   { padding: .28rem 0; }
    .inbox-btn {
      background: none; border: none;
      font: inherit; font-size: .92rem;
      color: var(--text); cursor: pointer; padding: 0;
      text-align: left; display: block; width: 100%;
      transition: opacity .1s;
    }
    .inbox-btn.unread { opacity: 1; }
    .inbox-btn.read   { opacity: .28; }
    .inbox-btn.locked { opacity: .12; cursor: default; pointer-events: none; }
    .inbox-btn:not(.locked):hover { opacity: 1; }
    .inbox-sep  { margin-top: 1.6rem; }
    .inbox-mem-label { font-size: .7rem; opacity: .2; letter-spacing: .06em; margin-bottom: .4rem; }
    .inbox-mem-btn {
      background: none; border: none; font: inherit; font-size: .85rem;
      color: var(--text); cursor: pointer; padding: .18rem 0;
      opacity: .45; display: block;
    }
    .inbox-mem-btn:hover { opacity: 1; }
    .inbox-back { margin-top: 2rem; }

    /* ── Memory modal ── */
    #modal-mem {
      display: none; position: fixed; inset: 0; z-index: 50;
      align-items: center; justify-content: center; padding: 2rem;
      background: var(--scrim-bg); backdrop-filter: blur(4px);
    }
    #modal-mem.open { display: flex; }
    .mem-inner {
      background: var(--scrim-bg);
      backdrop-filter: blur(24px) contrast(.88);
      padding: 2rem 2.5rem; width: min(400px, 96vw);
    }
    .mem-type { margin-bottom: 1rem; }
    .mem-text { font-size: .88rem; line-height: 1.75; margin-bottom: 1.4rem; opacity: .75; }

    /* ── Error ── */
    #s-error .scrim { max-width: 440px; text-align: center; }
    .err-h { margin-bottom: .5rem; }
    .err-d { font-size: .8rem; word-break: break-word; margin-bottom: 1.5rem; }

    /* ── First-run banner ── */
    #frb {
      position: fixed; inset: 0; display: flex;
      align-items: center; justify-content: center;
      z-index: 4; pointer-events: none;
      opacity: 0; transition: opacity 1.5s ease;
    }
    #frb.vis { opacity: 1; }
    #frb p { font-style: italic; font-size: 1rem; opacity: .65;
              text-align: center; padding: 0 2rem; }

    /* ── Dev overlay ── */
    #dev-overlay {
      position: absolute; inset: 0; pointer-events: none; z-index: 6;
      font: 11px/1.6 'Courier New', monospace; color: rgba(180,0,0,1);
      white-space: pre; padding: 2px 4px;
      text-shadow: 0 0 4px rgba(255,255,255,.95), 0 1px 6px rgba(255,255,255,.9);
    }

    /* ── Dev badge ── */
    .dev-b {
      font-size: .62rem; padding: .08rem .28rem;
      background: rgba(0,0,0,.06); color: var(--text);
      opacity: .35; vertical-align: middle; margin-left: .35rem;
    }

    @media (max-width: 480px) {
      .scrim { padding: 1.5rem 1.25rem; width: min(560px, 98vw); }
      #s-reading { padding: 1rem .75rem; }
      #s-reading .scrim { width: min(520px, 96vw); max-height: 78vh; }
      .letter-body { font-size: 12px; }
      .welcome-inner p { font-size: .9rem; }
      #drop-zone { padding: 2rem 1.5rem; }
      .btn-row { gap: 1rem; }
      #hud { bottom: 35%; }
      #g { font-size: 11px; line-height: 13px; }
      #g > div { height: 13px; }
    }
    @media (max-width: 360px) {
      .scrim { padding: 1.25rem 1rem; }
      .t1 { font-size: .9rem; }
      .t2 { font-size: .78rem; }
    }
  </style>
</head>
<body>

<div id="g"></div>

<div id="hud">
  <p id="hud-author" class="t2"></p>
  <div id="hud-btns"></div>
  <p id="hud-animal" class="t4" style="margin-top:.5rem"></p>
</div>

<div id="frb">
  <p id="frb-text"></p>
</div>

<div id="s-welcome" class="screen active">
  <div class="welcome-inner">
    <p class="t1" style="font-size:1.1rem;margin-bottom:2rem;opacity:.8">LateLetter</p>
    <div id="drop-zone" role="button" tabindex="0"
         aria-label="Drop .lateletter file or press Enter to browse">
      <p class="t2">drop a <span style="opacity:.8">.lateletter</span> file here</p>
      <p class="t3" style="margin-top:.5rem">or <button class="btn hi" id="btn-browse"
          type="button" style="font-size:.75rem">browse files</button></p>
    </div>
    <input type="file" id="file-input" accept=".lateletter,.json">
    <p style="margin-top:1.2rem"><button class="btn" id="btn-demo"
        type="button" style="font-size:.7rem;opacity:.25">get demo letter</button>
      <button class="btn" id="btn-demo-sealed"
        type="button" style="font-size:.7rem;opacity:.25">get sealed letter</button></p>
  </div>
</div>

<div id="s-passphrase" class="screen">
  <div class="scrim">
    <p class="t1 pp-title" id="pp-title">Letters from —</p>
    <p class="t3 pp-sub">enter the passphrase to continue</p>
    <div class="warn-st t4" id="warn-st">browser storage unavailable — read history will not be saved</div>
    <p class="t3 pp-label">passphrase</p>
    <input class="fi" type="password" id="pp-input"
           autocomplete="off" spellcheck="false" autocorrect="off" autocapitalize="off">
    <p class="t4 pp-hint" id="pp-hint"></p>
    <p class="pp-err" id="pp-err">incorrect passphrase, or file modified</p>
    <p class="pp-info" id="pp-info">unlocking…</p>
    <div class="btn-row">
      <button class="btn hi" id="btn-unlock">unlock</button>
      <button class="btn"    id="btn-pp-back">back</button>
    </div>
  </div>
</div>

<div id="s-status" class="screen">
  <div class="scrim">
    <p class="t1 st-h"   id="st-h"></p>
    <p class="t3 st-sub" id="st-sub"></p>
    <div class="btn-row" id="st-btns"></div>
  </div>
</div>

<div id="s-select" class="screen">
  <div class="scrim">
    <p class="t2" style="margin-bottom:1.1rem">letters waiting</p>
    <ul class="pick-list" id="pick-list"></ul>
    <div class="btn-row"><button class="btn" id="btn-sel-back">← back</button></div>
  </div>
</div>

<div id="s-reading" class="screen">
  <div class="scrim">
    <p class="t3 lm-from"  id="lm-from"></p>
    <p class="t1 lm-label" id="lm-label"></p>
    <p class="t4 lm-date"  id="lm-date"></p>
    <p class="t4" id="lm-linect" style="display:none"></p>
    <div class="letter-body" id="letter-body" tabindex="0" role="article"></div>
    <div id="lm-progress"></div>
    <div class="btn-row">
      <button class="btn" id="btn-save">save</button>
      <button class="btn" id="btn-all">all letters</button>
      <button class="btn hi" id="btn-rd-back">← back</button>
    </div>
  </div>
</div>

<div id="s-archive" class="screen">
  <div class="inbox">
    <p class="t2 inbox-title" id="arc-title"></p>
    <ul class="inbox-list" id="arc-content"></ul>
    <div class="inbox-back btn-row">
      <button class="btn" id="btn-arc-back">← garden</button>
    </div>
  </div>
</div>

<div id="s-error" class="screen">
  <div class="scrim">
    <p class="t2 err-h" id="err-h">something went wrong</p>
    <p class="t4 err-d" id="err-d"></p>
    <div class="btn-row" style="justify-content:center">
      <button class="btn hi" onclick="location.reload()">start over</button>
    </div>
  </div>
</div>

<div id="modal-mem" role="dialog" aria-modal="true" aria-hidden="true">
  <div class="mem-inner">
    <p class="t3 mem-type" id="mem-type"></p>
    <p class="mem-text" id="mem-text"></p>
    <div class="btn-row"><button class="btn hi" id="btn-close-mem">close</button></div>
  </div>
</div>

<script type="module">

let prepareWithSegments = null;
let layoutWithLines = null;
let clearCache = () => {};
let _textLayoutMode = 'fallback';

// ═══════════════════════════════════════════════════════════════════
//  PALETTE — sky/ground monochrome, plants colored
// ═══════════════════════════════════════════════════════════════════

const C = {
  sky:           '#f9f8f5',
  ground:        '#c8c2b6',
  dim_green:     '#ddd8ce',
  deep_green:    '#33511e',
  green:         '#4a7030',
  bright_green:  '#62923e',
  brown:         '#7a5830',
  orange:        '#b07020',
  bright_white:  '#555555',
  white:         '#777777',
  yellow:        '#8a6418',
  bright_yellow: '#c09428',
  red:           '#883830',
  bright_red:    '#b85038',
  cyan:          '#246858',
  bright_cyan:   '#329878',
  rain:          '#4a6888',
  magenta:       '#702468',
  bright_magenta:'#a03888',
  gray:          '#888880',
  dim:           '#b0a898',
  flash:         '#000000',
  // Night palette
  star:          '#8a8878',
  moon:          '#d0ccb8',
};

// Night palette overrides — brighter variants for dark background
const NIGHT_PALETTE = {
  sky:           '#0b0e16',
  ground:        '#28302a',
  dim_green:     '#13181e',
  deep_green:    '#41703e',
  green:         '#5a9858',
  bright_green:  '#78b870',
  brown:         '#a08868',
  orange:        '#c89848',
  bright_white:  '#cccccc',
  white:         '#b0b0a8',
  yellow:        '#c09838',
  bright_yellow: '#e0b848',
  red:           '#c06858',
  bright_red:    '#e87868',
  cyan:          '#48a888',
  bright_cyan:   '#68c8a0',
  rain:          '#7898b8',
  magenta:       '#a85898',
  bright_magenta:'#d068b8',
  gray:          '#a0a098',
  dim:           '#606058',
  flash:         '#ffffff',
  star:          '#b8b8a8',
  moon:          '#e8e4d0',
};
let _dayPalette = null; // stashed original C values when night is active

function _applyNightPalette(on) {
  if (on && !_dayPalette) {
    _dayPalette = {};
    for (const k of Object.keys(NIGHT_PALETTE)) { _dayPalette[k] = C[k]; C[k] = NIGHT_PALETTE[k]; }
    document.documentElement.style.setProperty('--text', '#d0ccc0');
    document.documentElement.style.setProperty('--bg', '#0b0e16');
    document.documentElement.style.setProperty('--scrim-bg', 'rgba(11, 14, 22, .76)');
  } else if (!on && _dayPalette) {
    for (const k of Object.keys(_dayPalette)) C[k] = _dayPalette[k];
    _dayPalette = null;
    document.documentElement.style.setProperty('--text', '#000000');
    document.documentElement.style.setProperty('--bg', '#f9f8f5');
    document.documentElement.style.setProperty('--scrim-bg', 'rgba(249, 248, 245, .76)');
  }
}

async function initTextLayout(){
  try{
    ({prepareWithSegments,layoutWithLines,clearCache} =
      await import('https://cdn.jsdelivr.net/npm/@chenglou/pretext@0.0.4/+esm'));
    _textLayoutMode='pretext';
  }catch(err){
    console.warn('[viewer] pretext unavailable; using browser text fallback',err);
    prepareWithSegments=null; layoutWithLines=null; clearCache=()=>{};
    _textLayoutMode='fallback';
  }
}

// ── Moon phase art (FL-G20) ──────────────────────────────────────────
const MOON_ART = [
  [],                                  // 0: new moon (invisible)
  ['  _',' ) ',' \u203e '],            // 1: waxing crescent
  [' _ ','|) ',' \u203e '],            // 2: first quarter
  [' __ ','(O) ',' \u203e\u203e '],    // 3: waxing gibbous
  [' __ ','(  )',' \u203e\u203e '],    // 4: full
  [' __ ',' (O)',' \u203e\u203e '],    // 5: waning gibbous
  [' _ ',' (|',' \u203e '],            // 6: last quarter
  [' _ ',' ( ',' \u203e '],            // 7: waning crescent
];
function _moonPhase(){
  // Synodic month ~ 29.53 days. Known new moon: 2000-01-06 18:14 UTC
  const ref=Date.UTC(2000,0,6,18,14);
  const days=(Date.now()-ref)/86400000;
  const cyc=((days%29.53)+29.53)%29.53; // double-modulo for pre-2000 clocks
  return(cyc/29.53*8)|0;
}

// Character cell size — measured once from DOM
let CW = 8, CH = 15;

// ── Animal relationship system (§6.8.2) ──────────────────────────────────
const _ANIMAL_TYPES = ['cat', 'bird', 'rabbit', 'turtle'];
const _ANIMAL_ART = {
  cat: {
    0: ['/\\_ ','o.  '],
    1: ['/\\_/\\','(o.o)',' >^< '],
    2: ['/\\_/\\','(-.-)',' = = '],
    3: ['/\\_/\\','(zzz)',' ~_~ '],
  },
  bird: {
    0: ['>-'],
    1: ['>o<',' | '],
    2: ['>o<','/|\\'],
    3: ['(o)','/|\\'],
  },
  rabbit: {
    0: ['(\\ '],
    1: ['(\\ /)','.    '],
    2: ['(\\ /)',' . . '],
    3: ['(\\./)','  z  '],
  },
  turtle: {
    0: [' (~) '],
    1: [' (~) ','{__} '],
    2: [' (~) ','{__} '],
    3: ['(~o~)','{__}'],
  },
};
const _ANIMAL_DELIVERY_FRAMES = {
  cat:    [['/\\_/\\  ','(>[✉])  '],['/\\_/\\  ','(=[✉])  ']],
  bird:   [['  >o<   ',' /|\\    ',' [✉]    '],['  >o<   ','  |\\    ',' [✉]    ']],
  rabbit: [['(\\ /)  ','.[✉].   '],['(\\ /)  ',' [✉]    ']],
  turtle: [[' (~)    ','{[✉]}   '],[' (~)    ','{[✉]}   ']],
};
// Default delivery creature (SPEC §6.3) — used unless an animal is bonded.
const _LETTERBIRD_FRAMES = [
  ['  \\      ',' >o<-[✉] ','  /      '],
  ['  /      ',' >o<-[✉] ','  \\      '],
];
const _ANIMAL_FOOTPRINTS = {cat:'. .',bird:'v v',rabbit:'. .',turtle:'---'};
const _ANIMAL_POSE_ART = {
  cat: {
    peek: ['/\\_ ','o.  '],
    blink: ['/\\_/\\','(-.-)',' >^< '],
    tail: ['/\\_/\\','(o.o)',' ~~^ '],
    stretch: ['/\\_/\\\\','(o.o )',' _^_  '],
    nap: ['/\\_/\\','(zzz)',' ~_~ '],
    feed: ['/\\_/\\','(o.o)',' [_]  '],
  },
  bird: {
    peek: ['>-'],
    perch: ['>o<',' | '],
    turn: ['<o>',' | '],
    ruffle: ['\\o/',' | '],
    dip: [' v ','/|\\'],
    settled: ['(o)','/|\\'],
  },
  rabbit: {
    peek: ['(\\ '],
    twitch: ['(\\ /)',' . . '],
    hop: ['(\\ /)','  .  '],
    groom: ['(\\./)','  u  '],
    rest: ['(\\./)','  z  '],
    feed: ['(\\ /)',' \\/  '],
  },
  turtle: {
    peek: [' (~) '],
    step: [' (~)_','{__} '],
    turn: [' (o~) ',' {__} '],
    bob: ['(~o~)','{__}'],
    rest: ['(~-~)','{__}'],
    feed: [' (~) ','{_~} '],
  },
};
const _ANIMAL_FEED_GLYPHS = {
  cat: {lines:['[_]'],color:'bright_yellow',dx:3,dy:1},
  bird: {lines:["'.'"],color:'bright_yellow',dx:0,dy:2},
  rabbit: {lines:['"','\\/'],color:'bright_yellow',dx:1,dy:2},
  turtle: {lines:['(_)'],color:'bright_green',dx:3,dy:1},
};
const _AMBIENT_BIRD_FRAMES = ['\\v/','_v_','/v\\','_v_'];
const _AMBIENT_BIRD_COMPACT_FRAMES = ['>-','~>'];

function _strHash(s){let h=0;for(let i=0;i<s.length;i++)h=(Math.imul(31,h)+s.charCodeAt(i))|0;return h>>>0;}
function animalTrustTier(n){return n>=14?3:n>=7?2:n>=3?1:0;}
function animalHomePos(type,seed,cols,rows){
  const rng=new RNG((_strHash(type)^seed)>>>0);
  const groundRow=rows-4;
  const baseCol=Math.min(cols-10,Math.max(4,Math.floor(cols*.25)+rng.randint(-6,6)));
  if(type==='bird') return{row:Math.max(3,groundRow-6),col:Math.min(cols-8,Math.max(4,baseCol+2))};
  if(type==='turtle') return{row:groundRow,col:Math.min(cols-8,Math.max(4,baseCol-1))};
  return{row:groundRow,col:baseCol};
}
function animalFrame(type,tier,pose='base'){
  return(_ANIMAL_POSE_ART[type]&&_ANIMAL_POSE_ART[type][pose])||((_ANIMAL_ART[type]||{})[tier]||[]);
}
function artWidth(lines){
  return lines.reduce((m,ln)=>Math.max(m,ln.length),0);
}
function clamp(n,min,max){
  return Math.max(min,Math.min(max,n));
}

class RNG {
  constructor(seed) {
    seed = seed >>> 0;
    const h = x => { x ^= x>>16; x = Math.imul(x,0x45d9f3b)>>>0; x ^= x>>16; return x>>>0; };
    this._a=h(seed); this._b=h(seed+1); this._c=h(seed+2); this._d=h(seed+3);
    for (let i=0;i<20;i++) this.random();
  }
  random() {
    let a=this._a,b=this._b,c=this._c,d=this._d;
    const t=(a+b|0)+d|0; this._d=d+1|0; this._a=b^(b>>>9);
    this._b=(c+(c<<3))|0; this._c=(c<<21|c>>>11); this._c=this._c+t|0;
    return (t>>>0)/4294967296;
  }
  randint(a,b)  { return a+Math.floor(this.random()*(b-a+1)); }
  choice(arr)   { return arr[Math.floor(this.random()*arr.length)]; }
  choices(arr,w){ let r=this.random()*w.reduce((s,x)=>s+x,0);
    for(let i=0;i<arr.length;i++){r-=w[i];if(r<=0)return arr[i];}
    return arr[arr.length-1]; }
  uniform(a,b)  { return a+this.random()*(b-a); }
}

class ScreenBuffer {
  constructor(rows,cols){
    this.rows=rows; this.cols=cols;
    const n=rows*cols;
    this._ch=new Array(n).fill(' ');
    this._col=new Array(n).fill('sky');
    this._anim=new Uint8Array(n); // 1 = animated cell (keeps color in mode 3)
  }
  clear(){ this._ch.fill(' '); this._col.fill('sky'); this._anim.fill(0); }
  put(r,c,ch,col){
    if(r<0||r>=this.rows||c<0||c>=this.cols)return;
    const i=r*this.cols+c; this._ch[i]=ch; this._col[i]=col;
  }
  putStr(r,c,text,col){ for(let i=0;i<text.length;i++) this.put(r,c+i,text[i],col); }
  // Animated variants — tagged for color-mode 3 (B&W except anim)
  putAnim(r,c,ch,col){
    if(r<0||r>=this.rows||c<0||c>=this.cols)return;
    const i=r*this.cols+c; this._ch[i]=ch; this._col[i]=col; this._anim[i]=1;
  }
  putStrAnim(r,c,text,col){ for(let i=0;i<text.length;i++) this.putAnim(r,c+i,text[i],col); }
}

class GardenState {
  constructor(cols,rows,seed,season){
    this.cols=cols; this.rows=rows; this.seed=seed; this.season=season;
    this.groundY=rows-3; this.frame=0; this.wind=0;
    this.postComplete=false; this.animalData=null; this.night=false; this.timeOfDay='day';
    this.collisionMap=new Set(); this.topSurfaces={}; this.canopyCells=new Set();
    this.mouseRow=-1; this.mouseCol=-1;
  }
}

function pPine(rng){
  const h=rng.randint(8,16),lvls=h-2;
  const rows=[[1,0,'|','brown'],[2,0,'|','brown']];
  for(let lv=0;lv<lvls;lv++){
    const dy=3+lv,w=lv;
    if(lv===lvls-1){rows.push([dy,0,'^','bright_green']);}
    else{const tip=lv%2?'*':'^',s='/'.repeat(w+1)+tip+'\\'.repeat(w+1);
      rows.push([dy,-(w+1),s,lv>=lvls/2?'bright_green':'green']);}
  }
  return{type:'pine',rows,width:lvls*2+2,height:h+1};
}
function pOak(rng){
  const h=rng.randint(8,14),th=Math.max(2,h/3|0);
  const ch=rng.choice(['@','o','0','&']),rows=[];
  for(let i=1;i<=th;i++) rows.push([i,0,'|','brown']);
  const cr=h-th,rad=(cr/2|0)+1;
  for(let lv=0;lv<=cr+1;lv++){
    const dy=th+lv+1,t=(lv/(cr+1))*2-1;
    const w=Math.max(0,Math.round(rad*Math.sqrt(Math.max(0,1-t*t))));
    if(!w)continue;
    rows.push([dy,-w,ch.repeat(w*2+1),(lv>0&&lv<=cr)?'bright_green':'green']);
  }
  return{type:'oak',rows,width:rad*2+3,height:h+3};
}
function pBush(rng){
  const w=rng.randint(2,4),ch=rng.choice(['~','u','w','v']);
  return{type:'bush',rows:[
    [2,-(w+1),'('+ch.repeat(w*2+1)+')','bright_green'],
    [1,-w,'{'+ch.repeat(w*2-1)+'}','green']],width:w*2+4,height:2};
}
function pFlower(rng){
  const sp=rng.choice(['daisy','tulip','sunflower','wildflower','rose']);
  const sh=rng.randint(2,5),rows=[];
  for(let i=1;i<=sh;i++) rows.push([i,0,'|','green']);
  if(sh>=2){
    const ly=rng.randint(1,sh-1),sd=rng.choice(['left','right','both','none','none']);
    if(sd==='left'||sd==='both') rows.push([ly,-1,'\\','green']);
    if(sd==='right'||sd==='both') rows.push([ly,1,'/','green']);
  }
  const bh=sh+1; let w=3;
  if(sp==='daisy'){const c=rng.choice(['white','bright_white','cyan','bright_cyan']);
    rows.push([bh+1,-1,'\\*/',c],[bh,-1,'-O-','bright_yellow']);}
  else if(sp==='tulip'){const c=rng.choice(['red','magenta','bright_magenta','bright_red']);
    rows.push([bh+1,-1,'(")',c],[bh,-1,'|"|',c]);}
  else if(sp==='sunflower'){rows.push([bh+1,-2,'\\{O}/','bright_yellow'],[bh,-1,'{#}','yellow']);w=5;}
  else if(sp==='wildflower'){const c=rng.choice(['magenta','bright_magenta','cyan','bright_cyan','bright_white']);
    rows.push([bh+1,0,'*',c],[bh,-1,'>*<',c]);}
  else{const c=rng.choice(['red','bright_magenta','bright_red']);
    rows.push([bh+1,-1,'@@@',c],[bh,-1,'(@)',c]);}
  return{type:'flower',species:sp,rows,width:w,height:bh+2};
}
// Grass wind model ported from asciicker-y9-2 (FL-4482 "saved static cycle"):
// a blade never leaves its cell — its tip glyph cycles through a fixed family,
// phase = (per-clump seed + time step) % family size. Lean geometry from
// glyph_fx_preview.py: upper cells lean more, world lean + slow ~0.1Hz sway.
const GRASS_FAMS=[["'","`",','],['/','|','\\'],['v','y','w'],['"',';',"'"]];
const GRASS_FLOWER_FAM=['*','+','*'];
function grassCyclePhase(seed,frame,n){
  return (seed+Math.floor(frame*0.12))%n;
}
function pGrass(rng){
  const nb=rng.randint(1,3);
  const dxs=nb===1?[0]:nb===2?[-1,1]:[-1,0,1];
  const blades=[];let maxH=0;
  for(const dx of dxs){
    const h=rng.randint(2,5);if(h>maxH)maxH=h;
    blades.push({dx,h,seed:rng.randint(0,1023),
      fam:rng.randint(0,GRASS_FAMS.length-1),flower:rng.random()<0.09});
  }
  // Static upright rows kept for collision/top-surface; live sway is rendered
  // separately in PlantLayer so rain/snow still land sensibly.
  const rows=[];
  for(const b of blades){
    rows.push([b.h,b.dx,b.flower?'*':"'",'bright_green']);
    for(let i=1;i<b.h;i++) rows.push([i,b.dx,'|','green']);
  }
  return{type:'grass',rows,blades,width:nb===1?1:3,height:maxH};
}
function pMushroom(rng){
  const w=rng.randint(1,2),c=rng.choice(['red','bright_red','yellow','bright_white','magenta']);
  return{type:'mushroom',rows:[[2,-w,'('+'~'.repeat(w*2)+')',c],[1,0,'|','white']],width:w*2+2,height:2};
}
function pFern(rng){
  const h=rng.randint(2,4),rows=[[h+1,0,'*','bright_green']];
  for(let i=1;i<=h;i++){
    rows.push([i,0,'|','green']);
    const lc=i%2?'bright_green':'green';
    rows.push([i,-1,i%2?'*':',',lc],[i,1,i%2?'*':',',lc]);
  }
  return{type:'fern',rows,width:3,height:h+1};
}

const AUTUMN_COLS=['yellow','bright_yellow','orange','red','brown'];
const DECIDUOUS=new Set(['oak','bush','willow']);
function applyAutumn(plant,rng){
  if(!DECIDUOUS.has(plant.type))return;
  plant.rows=plant.rows.map(([dy,dx,t,c])=>[dy,dx,t,
    (c==='bright_green'||c==='green')?rng.choice(AUTUMN_COLS):c]);
}
const SEASON_W={
  spring:{pine:6,oak:6,bush:8,flower:30,grass:15,mushroom:2,fern:5},
  summer:{pine:8,oak:8,bush:8,flower:18,grass:12,mushroom:3,fern:7},
  autumn:{pine:10,oak:10,bush:6,flower:4,grass:8,mushroom:5,fern:6},
  winter:{pine:15,oak:4,bush:4,flower:0,grass:4,mushroom:2,fern:3},
};
const DEFAULT_W={pine:8,oak:8,bush:8,flower:18,grass:12,mushroom:3,fern:7};
const MAKERS={pine:pPine,oak:pOak,bush:pBush,flower:pFlower,grass:pGrass,mushroom:pMushroom,fern:pFern};

function makePlant(rng,ptype,weights,season){
  if(!ptype){const w=weights||DEFAULT_W;ptype=rng.choices(Object.keys(w),Object.values(w));}
  const p=MAKERS[ptype](rng);
  if(season==='autumn')applyAutumn(p,rng);
  if(p.blades){
    if(season==='spring')for(const b of p.blades)if(b.seed%5===0)b.flower=true;
    else if(season==='winter')for(const b of p.blades)b.flower=false;
  }
  return p;
}
function genLayout(cols,rows,seed,weights,season){
  const rng=new RNG(seed),gy=rows-3,placed=[],occ=[];
  for(let _=0;_<cols*3;_++){
    const p=makePlant(rng,null,weights,season);
    const half=(p.width>>1)+2;
    if(cols<half*2+4)continue;
    const x=rng.randint(half+1,cols-half-2);
    const xmin=x-half-1,xmax=x+half+1;
    if(occ.some(([mn,mx])=>xmin<mx&&xmax>mn))continue;
    occ.push([xmin,xmax]);
    placed.push({plant:p,x,gy});
  }
  return placed;
}
const CANOPY=new Set(['pine','oak']);
const CANOPY_SHIMMER=new Set(['oak','bush','pine']);
const LEAF_CANOPY=new Set(['oak','willow']);
function buildCollision(placed){
  const col=new Set(),top={},can=new Set(),pine=new Set();
  for(const{plant,x,gy}of placed){
    const isLeafC=LEAF_CANOPY.has(plant.type);
    const isPine=plant.type==='pine';
    for(const[dy,dx,text]of plant.rows){
      const row=gy-dy;
      for(let i=0;i<text.length;i++){
        if(text[i]===' ')continue;
        const c=x+dx+i,key=`${row},${c}`;
        col.add(key);
        if(top[c]===undefined||row<top[c])top[c]=row;
        if(isLeafC&&dy>=3)can.add(key);
        if(isPine&&dy>=3)pine.add(key);
      }
    }
  }
  return{col,top,can,pine};
}

const GND=',~.^,.,~^,.,~,.^,~.,';
class BackgroundLayer{
  render(buf,state){
    const{cols,groundY:gy}=state;
    for(let c=0;c<cols;c++){
      buf.put(gy,  c,GND[c%GND.length],'ground');
      buf.put(gy+1,c,GND[(c+5)%GND.length],'dim_green');
    }
    if(state.night){
      // Scatter stars — deterministic from seed so they don't flicker every reset
      const rng=new RNG(state.seed^0xc0ffee01);
      const nStars=Math.floor(cols*(gy-3)*0.025);
      for(let i=0;i<nStars;i++){
        const sr=rng.randint(0,Math.max(0,gy-4));
        const sc=rng.randint(0,cols-1);
        const bright=rng.random()<0.18;
        buf.put(sr,sc,bright?'*':'.', bright?'moon':'star');
      }
      // Moon — phase-aware, upper-right quadrant
      const phase=_moonPhase();
      const art=MOON_ART[phase];
      if(art.length){
        const mc=Math.floor(cols*0.78);
        const mw=Math.max(...art.map(l=>l.length));
        const mx=Math.max(0,Math.min(mc,cols-mw-1));
        for(let i=0;i<art.length;i++) buf.putStr(1+i,mx,art[i],'moon');
      }
    }
  }
}

// Rustle on cursor hover
const RUSTLE_A={'@':'o','o':'0','0':'@','&':'@','*':'.', '^':'*','~':'`','u':'v','v':'u','w':'~','(':'<',')':'>'};
const RUSTLE_B={'@':'0','o':'@','0':'o','&':'o','*':',', '^':'`','~':'v','u':'~','v':'w','w':'u'};
const RUSTLE_EL=new Set('@o0&*^~uvw');
function rustleChar(ch,intensity,seed){
  if(!RUSTLE_EL.has(ch))return ch;
  const n=Math.sin(seed)*intensity;
  if(n>0.45)return RUSTLE_A[ch]||ch;
  if(n<-0.45)return RUSTLE_B[ch]||ch;
  return ch;
}

class PlantLayer{
  constructor(){this.placed=[];}
  regenerate(state){
    const w=SEASON_W[state.season]||DEFAULT_W;
    this.placed=genLayout(state.cols,state.rows,state.seed,w,state.season);
    const{col,top,can,pine}=buildCollision(this.placed);
    state.collisionMap=col; state.topSurfaces=top; state.canopyCells=can; state.pineCells=pine;
  }
  // Live grass: tri-stop color ramp (deep→green→bright, root→tip) and
  // blade lean = wind*1.6 + sin(0.1Hz + seed)*0.6, scaled by height fraction.
  _renderGrass(buf,state,plant,x,gy){
    const t=state.frame,season=state.season;
    // Seasonal ramps: summer/spring green, autumn straw, winter dull gray.
    const ramp=season==='autumn'?['brown','yellow','bright_yellow']
      :season==='winter'?['gray','gray','dim']
      :['deep_green','green','bright_green'];
    const tipCol=season==='autumn'?'bright_yellow':season==='winter'?'dim':'bright_green';
    for(const b of plant.blades){
      const lean=state.wind*1.6+Math.sin((t/200+b.seed*0.37)*6.2832)*0.6;
      for(let i=1;i<=b.h;i++){
        const frac=i/b.h,xoff=Math.round(lean*frac*1.2);
        const row=gy-i,col=x+b.dx+xoff;
        const l=lean*frac;
        if(i===b.h){
          const fam=b.flower?GRASS_FLOWER_FAM:GRASS_FAMS[b.fam];
          const ch=fam[grassCyclePhase(b.seed,t,fam.length)];
          buf.putAnim(row,col,ch,b.flower?'bright_yellow':tipCol);
        }else{
          const ch=l>0.3?'/':l<-0.3?'\\':'|';
          buf.put(row,col,ch,ramp[frac<0.4?0:frac<0.75?1:2]);
        }
      }
    }
  }
  // Ground cover: density-bucketed filler glyphs on the row above the ground
  // line (sparse/medium/dense char sets), deterministic per column; a few
  // cells shimmer via the same static-cycle trick.
  _renderGroundCover(buf,state){
    const gy=state.groundY,seed=state.seed;
    const winter=state.season==='winter';
    for(let c=0;c<state.cols;c++){
      const h=(Math.imul(c+13,0x9e3779b1)^seed)>>>0;
      const v=(h%1000)/1000;
      if(v<(winter?0.82:0.48))continue;
      let ch,colr;
      if(v>0.92){ch='"';colr='green';}
      else if(v>0.72){ch=';';colr='deep_green';}
      else{ch=(h&1)?'.':',';colr='dim_green';}
      if(h%11===0){
        const fam=GRASS_FAMS[3];
        ch=fam[grassCyclePhase(h&255,state.frame,fam.length)];
      }
      if(winter){ch=(h&1)?'.':'*';colr=(h&2)?'white':'dim';}          // snow-dusted
      else if(state.season==='autumn'&&v>0.85)colr='yellow';          // strewn straw
      buf.put(gy-1,c,ch,colr);
    }
  }
  render(buf,state){
    const mr=state.mouseRow,mc=state.mouseCol;
    const R=5,R2=R*R;
    this._renderGroundCover(buf,state);
    const shimmerI=0.55+Math.abs(state.wind)*1.1;
    for(const{plant,x,gy}of this.placed){
      if(plant.blades){this._renderGrass(buf,state,plant,x,gy);continue;}
      const canShimmer=CANOPY_SHIMMER.has(plant.type);
      for(const[dy,dx,text,color]of plant.rows){
        const row=gy-dy,baseCol=x+dx;
        for(let i=0;i<text.length;i++){
          let ch=text[i],anim=false;
          const col=baseCol+i;
          // Ambient canopy shimmer: a sparse fixed subset of foliage cells
          // rustles with the wind (same static-cycle idea as grass tips) —
          // the trees breathe without needing the cursor.
          if(canShimmer&&dy>=2&&ch!==' '){
            const h=(Math.imul(row*73+col*151+7,0x9e3779b1)>>>0);
            if(h%8===0){
              const ch2=rustleChar(ch,shimmerI,state.frame*0.06+(h%97)*0.7);
              if(ch2!==ch){ch=ch2;anim=true;}
            }
          }
          if(mr>=0&&ch!==' '){
            const dr=row-mr,dc=col-mc,d2=dr*dr+dc*dc;
            if(d2<R2){
              const intensity=(1-Math.sqrt(d2)/R)*1.2;
              ch=rustleChar(ch,intensity,state.frame*0.4+col*1.9+row*2.7);
            }
          }
          if(anim)buf.putAnim(row,col,ch,color);
          else buf.put(row,col,ch,color);
        }
      }
    }
  }
}

class Particle{
  constructor(kind,x,y,vx,vy,ch,color,maxAge){
    this.kind=kind;this.x=x;this.y=y;this.vx=vx;this.vy=vy;
    this.ch=ch;this.color=color;this.age=0;this.maxAge=maxAge;
    this.phase=Math.random()*6.28;this.amp=0.3+Math.random()*0.7;
    this.rotPhase=Math.floor(Math.random()*3);
  }
}

class ParticleLayer{
  constructor(){this._p=[];this._rng=new RNG(Date.now()&0xffffffff);this._t=0;this._snow={};}
  reset(){this._p=[];this._snow={};}

  update(state){
    this._t++;
    if(this._t%2===0)this._spawn(state);
    const alive=[];
    for(const p of this._p){
      p.age++;
      if(p.kind==='rain'){
        p.vy=Math.min(p.vy+0.08,2.2);               // gravity
        p.x+=p.vx+state.wind*0.3; p.y+=p.vy;
        const r=p.y|0,c=p.x|0,key=`${r},${c}`;
        if(state.collisionMap.has(key)){
          this._fragments(c,r,state.wind);            // plant hit → fragments
        }else if(r>=state.groundY){
          this._splashes(c,state.groundY);            // ground hit → splashes
        }else if(p.age<=p.maxAge&&p.x>=0&&p.x<state.cols){
          alive.push(p);
        }
        continue;
      }
      if(p.kind==='snow'){
        p.x+=p.amp*Math.sin(p.phase+p.age*0.04)*0.25; p.y+=p.vy;
        const ic=Math.round(p.x);
        const surf=state.topSurfaces[ic]!==undefined?state.topSurfaces[ic]:state.groundY;
        const dep=this._snow[ic]||0;
        if((p.y|0)>=surf-dep){
          if(dep<3)this._snow[ic]=(dep+1);            // accumulate
          continue;
        }
        if(p.age<=p.maxAge&&p.x>=0&&p.x<state.cols&&p.y>=0)alive.push(p);
        continue;
      }
      if(p.kind==='leaf'){
        p.vx+=state.wind*0.04;
        p.vx=Math.max(-0.8,Math.min(0.8,p.vx));
        p.vy=Math.min(p.vy+0.04,1.5);
        p.x+=p.vx; p.y+=p.vy*0.4;
        if(p.age%8===0){p.rotPhase=(p.rotPhase+1)%3;}
        p.ch=['\\','-','/'][p.rotPhase];
        if((p.y|0)>=state.groundY){
          p.kind='leaf-rest';p.vx=0;p.vy=0;p.ch='-';p.age=0;p.maxAge=41;
          alive.push(p);
        }else if(p.age<=p.maxAge&&p.x>=0&&p.x<state.cols){
          alive.push(p);
        }
        continue;
      }
      if(p.kind==='leaf-rest'){
        if(p.age<p.maxAge){alive.push(p);}
        continue;
      }
      if(p.kind==='frag'||p.kind==='splash'){
        // Age char: ' → . → ·
        const f=p.age/p.maxAge;
        p.ch=f<0.4?"'":f<0.75?'.':'\u00b7';
        if(p.kind==='frag'){p.vx*=0.82;p.vy+=0.05;}
        else{p.vx*=0.88;}
        p.x+=p.vx; p.y+=p.vy;
        if(p.age<p.maxAge&&p.x>=0&&p.x<state.cols&&p.y<state.groundY+2)alive.push(p);
        continue;
      }
    }
    this._p=alive;
  }

  _fragments(cx,cy,wind){
    const rng=this._rng,n=rng.randint(2,4);
    for(let i=0;i<n;i++)
      this._p.push(new Particle('frag',cx,cy,
        (wind>0?-1:1)*rng.uniform(0.1,0.4),rng.uniform(-0.3,0),
        "'","rain",rng.randint(3,8)));
  }
  _splashes(cx,gy){
    const rng=this._rng,n=rng.randint(3,5);
    for(let i=0;i<n;i++)
      this._p.push(new Particle('splash',
        cx+rng.randint(-1,1),gy,rng.uniform(-0.35,0.35),0,
        "'","white",rng.randint(3,8)));
  }

  _spawn(state){
    const rng=this._rng,s=state.season;
    const rainN=this._p.filter(p=>p.kind==='rain').length;
    // Rain char leans with wind
    const rc=state.wind>0.2?'\\':state.wind<-0.2?'/':'|';
    if(s==='spring'&&rainN<60&&rng.random()<0.35)
      this._p.push(new Particle('rain',rng.random()*state.cols,0,
        state.wind*0.3,rng.uniform(0.5,1.0),rc,'rain',60));
    if(s==='autumn'&&rainN<120){
      const n=rng.randint(2,5);
      for(let i=0;i<n;i++)
        this._p.push(new Particle('rain',rng.random()*state.cols,0,
          state.wind*0.3,rng.uniform(0.7,1.4),rc,'rain',35));
    }
    if(s==='winter'&&this._p.filter(p=>p.kind==='snow').length<80)
      this._p.push(new Particle('snow',rng.random()*state.cols,0,0,
        rng.uniform(0.08,0.25),rng.choice(['.','*']),'bright_white',300));
    if(s==='autumn'){
      const leafCap=Math.max(0,Math.min(60,Math.floor(state.canopyCells.size/3)));
      const leafCount=this._p.filter(p=>p.kind==='leaf'||p.kind==='leaf-rest').length;
      if(leafCount<leafCap){
        let x,y,vx,vy;
        if(rng.random()<0.3){
          x=rng.random()*state.cols;y=rng.randint(0,2);
          vx=rng.uniform(-0.3,0.3);vy=rng.uniform(0.1,0.25);
        }else{
          const arr=Array.from(state.canopyCells);
          const[r,c]=arr[Math.floor(rng.random()*arr.length)].split(',').map(Number);
          x=c;y=r;vx=rng.uniform(-0.2,0.2);vy=rng.uniform(0.05,0.2);
        }
        this._p.push(new Particle('leaf',x,y,vx,vy,
          rng.choice([',','\'','~','*']),rng.choice(AUTUMN_COLS),150));
      }
    }
  }

  spawnAt(mr,mc,state){
    const rng=new RNG(Date.now()&0xffffffff);
    let n=0;
    // Leaf burst from deciduous canopy
    for(let dr=-4;dr<=4&&n<10;dr++)
      for(let dc=-6;dc<=6&&n<10;dc++){
        if(!state.canopyCells.has(`${mr+dr},${mc+dc}`))continue;
        this._p.push(new Particle('leaf',mc+dc,mr+dr,
          rng.uniform(-0.5,0.5),rng.uniform(-0.3,0.1),
          rng.choice([',','\'','~','*','.']),
          rng.choice(state.season==='autumn'?AUTUMN_COLS:['bright_green','green','bright_yellow','yellow','bright_magenta']),100));
        n++;
      }
    // Pine needle rustle (FL-G22/G26) — use dedicated pineCells set
    if(n===0){
      for(let dr=-3;dr<=3&&n<6;dr++)
        for(let dc=-4;dc<=4&&n<6;dc++){
          const key=`${mr+dr},${mc+dc}`;
          if(!state.pineCells.has(key))continue;
          this._p.push(new Particle('frag',mc+dc,mr+dr,
            rng.uniform(-0.3,0.3),rng.uniform(0.05,0.2),
            rng.choice(["'",'.','`']),
            rng.choice(['bright_green','green']),rng.randint(8,16)));
          n++;
        }
    }
  }

  render(buf,state){
    for(const p of this._p) buf.putAnim(p.y|0,p.x|0,p.ch,p.color);
    // Snow accumulation piles
    for(const[col,dep]of Object.entries(this._snow)){
      const c=+col;
      if(c<0||c>=state.cols)continue;
      for(let d=0;d<dep;d++){
        const r=state.groundY-d;
        if(r>=0)buf.putAnim(r,c,(c+d)%3===0?'*':'.','bright_white');
      }
    }
  }
}

class CreatureLayer{
  constructor(){
    this._cr=[];this._birdT=0;this._init=false;
    this._animal=null;this._feedEvent=null;this._feedSeq=0;
  }
  reset(){
    this._cr=[];this._init=false;this._birdT=0;
    this._animal=null;this._feedEvent=null;
  }
  queueFeedReaction(data){
    if(!data||!data.type)return;
    this._feedEvent={type:data.type,seq:++this._feedSeq};
  }
  spawnAmbientBirdBurst(state){
    if(!state)return;
    this._spawnAmbientBirds(state,3+Math.floor(Math.random()*3),true);
    this._birdT=0;
  }
  debugAnimalState(){
    return this._animal?`${this._animal.mode}/${this._animal.pose}`:'none';
  }
  _initCreatures(state){
    this._init=true;
    const rng=new RNG(state.seed^0x12ab34cd),s=state.season;
    if(s==='spring'||s==='summer'){
      const n=rng.randint(1,2);
      for(let i=0;i<n;i++){
        const x=rng.randint(5,state.cols-5),y=rng.randint(3,state.groundY-8);
        this._cr.push({kind:'butterfly',x,y,vx:rng.random()>.5?.3:-.3,
          phase:rng.random()*6.28,
          color:rng.choice(['bright_magenta','magenta','bright_cyan','cyan']),
          frames:['><','||','><','\\/'],fi:0,active:true});
      }
    }
    if(s==='summer'&&state.timeOfDay==='evening'){
      const n=rng.randint(3,5);
      for(let i=0;i<n;i++){
        const x=rng.randint(3,state.cols-3),y=rng.randint(state.groundY-12,state.groundY-3);
        this._cr.push({kind:'firefly',x,y,vx:(i%3-1)*0.04,
          vy:i%2?0.02:-0.02,phase:i*0.7,on:3+(i%5),off:10+(i%15),active:true});
      }
    }
  }
  _spawnAmbientBirds(state,count,forceFlock=false){
    const frames=state.cols<60?_AMBIENT_BIRD_COMPACT_FRAMES:_AMBIENT_BIRD_FRAMES;
    const width=artWidth(frames);
    const fromL=Math.random()>.5;
    const flock=forceFlock?count:(Math.random()<0.28?3+Math.floor(Math.random()*3):1);
    const baseY=Math.floor(Math.random()*Math.max(4,state.groundY-12))+2;
    for(let i=0;i<flock;i++){
      const trail=i*5;
      const offsetY=(i%2===0?0:1)+(i===2?-1:0);
      this._cr.push({
        kind:'bird',
        x:fromL?-width-2-trail:state.cols+2+trail,
        y:clamp(baseY+offsetY,1,Math.max(2,state.groundY-8)),
        vx:fromL?0.42:-0.42,
        frames,
        fi:i%frames.length,
        frameStep:5+(i%3),
        active:true
      });
    }
  }
  _ensureAnimal(state){
    const ad=state.animalData;
    if(!ad||!ad.triggered){this._animal=null;return null;}
    const home=animalHomePos(ad.type,state.seed,state.cols,state.rows);
    if(!this._animal||this._animal.type!==ad.type){
      this._animal=this._newAnimal(ad,home,state);
      return this._animal;
    }
    const a=this._animal;
    const tierChanged=a.tier!==ad.tier;
    a.tier=ad.tier;
    a.wasAbsent=ad.wasAbsent;
    a.homeRow=home.row;
    a.homeCol=home.col;
    this._syncAnimalAnchors(a,state);
    if(tierChanged)this._resetAnimalTier(a,state);
    return a;
  }
  _newAnimal(ad,home,state){
    const a={
      type:ad.type,tier:ad.tier,wasAbsent:ad.wasAbsent,
      homeRow:home.row,homeCol:home.col,row:home.row,col:home.col,
      targetRow:home.row,targetCol:home.col,
      edgeRow:home.row,edgeCol:home.col,spotA:home.col,spotB:home.col,
      mode:'idle',pose:'base',timer:0,visible:true,feedGlyph:null
    };
    this._syncAnimalAnchors(a,state);
    this._resetAnimalTier(a,state);
    return a;
  }
  _syncAnimalAnchors(a,state){
    const width=Math.max(2,artWidth(animalFrame(a.type,Math.max(1,a.tier),'base')));
    a.edgeCol=clamp(state.cols-width-2,0,Math.max(0,state.cols-width));
    a.edgeRow=a.type==='bird'?Math.max(2,a.homeRow-1):state.rows-4;
    a.spotA=clamp(a.homeCol,0,Math.max(0,state.cols-width-1));
    const delta=a.type==='cat'?4:a.type==='bird'?4:a.type==='rabbit'?3:2;
    a.spotB=clamp(a.homeCol+delta,0,Math.max(0,state.cols-width-1));
  }
  _resetAnimalTier(a,state){
    a.feedGlyph=null;
    if(a.tier===0){
      a.row=a.edgeRow;
      a.col=a.edgeCol+1.2;
      a.targetCol=a.edgeCol;
      a.targetRow=a.edgeRow;
      a.mode='edge';
      a.pose='peek';
      a.timer=55;
      a.visible=false;
      return;
    }
    a.visible=true;
    if(a.tier===1){
      a.row=a.type==='bird'?a.homeRow+1:state.rows-4;
      a.col=a.edgeCol+1;
      a.targetCol=a.spotB;
      a.targetRow=a.type==='bird'?a.homeRow:a.row;
      a.mode='approach';
      a.pose=this._idlePose(a,false);
      a.timer=0;
      return;
    }
    a.row=a.homeRow;
    a.col=a.spotA;
    a.targetCol=a.spotB;
    a.targetRow=a.homeRow;
    a.mode=a.tier>=3?'settled':'patrol';
    a.pose=this._idlePose(a,false);
    a.timer=40;
  }
  _idlePose(a,hover){
    if(a.type==='cat')return hover?'blink':(a.tier>=3?'nap':'tail');
    if(a.type==='bird')return hover?'turn':(a.tier>=3?'settled':'perch');
    if(a.type==='rabbit')return hover?'twitch':(a.tier>=3?'groom':'twitch');
    return hover?(a.tier>=2?'turn':'step'):(a.tier>=3?'rest':'bob');
  }
  _runEdgePeek(a,state,peekPose,altPose,blinkPose=peekPose){
    if(--a.timer<=0){
      a.visible=!a.visible;
      a.timer=a.visible?42:96;
    }
    a.mode='edge';
    a.row=a.edgeRow;
    a.col=a.visible?a.edgeCol-0.8:a.edgeCol+1.2;
    const flap=state.frame%48;
    a.pose=!a.visible?peekPose:(flap<12?altPose:(flap<18?blinkPose:peekPose));
  }
  _move(a,colSpeed,rowSpeed=colSpeed){
    if(Math.abs(a.targetCol-a.col)<=colSpeed)a.col=a.targetCol;
    else a.col+=Math.sign(a.targetCol-a.col)*colSpeed;
    if(Math.abs(a.targetRow-a.row)<=rowSpeed)a.row=a.targetRow;
    else a.row+=Math.sign(a.targetRow-a.row)*rowSpeed;
  }
  _hoveringAnimal(a,state){
    const art=animalFrame(a.type,a.tier,a.pose);
    const h=art.length,w=Math.max(2,artWidth(art));
    return state.mouseRow>=0&&
      Math.abs(state.mouseRow-Math.round(a.row))<=h+1&&
      Math.abs(state.mouseCol-Math.round(a.col))<=w+2;
  }
  _consumeFeedEvent(a,state){
    if(!this._feedEvent||this._feedEvent.type!==a.type)return false;
    const glyph=_ANIMAL_FEED_GLYPHS[a.type];
    const width=glyph?artWidth(glyph.lines):0;
    a.mode='feed-react';
    a.pose='feed';
    a.timer=28;
    a.visible=true;
    a.targetRow=a.type==='bird'?a.homeRow+0.9:a.homeRow;
    a.targetCol=a.tier===0?Math.max(0,a.edgeCol-1):clamp(a.spotA+(a.type==='cat'?1:0),0,Math.max(0,state.cols-4));
    if(glyph){
      const homeCol=a.tier===0?Math.max(0,a.edgeCol-1):a.homeCol;
      a.feedGlyph={
        lines:glyph.lines,
        color:glyph.color,
        row:clamp(a.homeRow+(glyph.dy||0),0,Math.max(0,state.rows-glyph.lines.length-1)),
        col:clamp(homeCol+(glyph.dx||0),0,Math.max(0,state.cols-width-1)),
        timer:28
      };
    }
    this._feedEvent=null;
    return true;
  }
  _runFeedReaction(a){
    if(a.feedGlyph&&--a.feedGlyph.timer<=0)a.feedGlyph=null;
    if(a.mode!=='feed-react')return false;
    a.pose='feed';
    if(a.type==='bird'&&a.timer<12)a.targetRow=a.homeRow;
    if(a.tier>0&&a.timer<12)a.targetCol=a.spotA;
    this._move(a,a.type==='turtle'?0.12:0.34,a.type==='bird'?0.25:0.2);
    if(--a.timer<=0){
      a.mode=a.tier>=3?'settled':a.tier===2?'patrol':a.tier===1?'approach':'edge';
      a.pose=this._idlePose(a,false);
    }
    return true;
  }
  _updateCat(a,state,hover){
    if(a.tier===0){this._runEdgePeek(a,state,'peek','tail','blink');return;}
    if(a.tier===1){
      if(a.mode==='hide'){
        a.visible=false;
        if(--a.timer<=0){
          a.visible=true;
          a.col=a.edgeCol+1;
          a.targetCol=a.spotB;
          a.mode='approach';
        }
        return;
      }
      if(a.mode==='approach'){
        a.pose='tail';
        this._move(a,0.34);
        if(Math.abs(a.col-a.targetCol)<0.2){a.mode='pause';a.timer=38;}
        return;
      }
      if(a.mode==='retreat'){
        a.pose='tail';
        a.targetCol=a.edgeCol+1;
        this._move(a,0.34);
        if(Math.abs(a.col-a.targetCol)<0.2){a.mode='hide';a.timer=72;}
        return;
      }
      a.pose=hover?'blink':'tail';
      if(--a.timer<=0)a.mode='retreat';
      return;
    }
    if(--a.timer<=0){
      a.targetCol=a.targetCol===a.spotA?a.spotB:a.spotA;
      a.timer=a.tier>=3?70:42;
    }
    a.pose=hover?'blink':(a.tier>=3?(state.frame%90<18?'stretch':'nap'):(state.frame%42<10?'tail':'base'));
    this._move(a,a.tier>=3?0.08:0.18);
  }
  _updateBird(a,state,hover){
    if(a.tier===0){this._runEdgePeek(a,state,'peek','ruffle','turn');return;}
    if(a.tier===1){
      if(a.mode==='approach'){
        a.pose='dip';
        this._move(a,0.4,0.25);
        if(Math.abs(a.col-a.targetCol)<0.2&&Math.abs(a.row-a.targetRow)<0.2){a.mode='perch';a.timer=24;}
        return;
      }
      if(a.mode==='shift'){
        a.pose='perch';
        this._move(a,0.36,0.25);
        if(Math.abs(a.col-a.targetCol)<0.2&&Math.abs(a.row-a.targetRow)<0.2){a.mode='perch';a.timer=24;}
        return;
      }
      a.pose=hover?'turn':'perch';
      if(--a.timer<=0){
        a.mode='shift';
        const toAlt=Math.abs(a.targetCol-a.spotA)<0.2;
        a.targetCol=toAlt?a.spotB:a.spotA;
        a.targetRow=toAlt?a.homeRow+1:a.homeRow;
      }
      return;
    }
    if(--a.timer<=0){
      const roam=a.tier===2&&Math.random()<0.45;
      a.targetCol=roam&&Math.abs(a.targetCol-a.spotA)<0.2?a.spotB:a.spotA;
      a.targetRow=a.targetCol===a.spotA?a.homeRow:a.homeRow+1;
      a.timer=a.tier>=3?78:46;
    }
    a.pose=hover?'turn':(a.tier>=3?(state.frame%84<16?'ruffle':'settled'):(state.frame%56<12?'ruffle':'perch'));
    this._move(a,a.tier>=3?0.1:0.22,0.16);
  }
  _updateRabbit(a,state,hover){
    if(a.tier===0){this._runEdgePeek(a,state,'peek','twitch');return;}
    if(a.tier===1){
      if(a.mode==='hide'){
        a.visible=false;
        if(--a.timer<=0){
          a.visible=true;
          a.col=a.edgeCol+1;
          a.targetCol=a.spotB;
          a.mode='approach';
        }
        return;
      }
      if(a.mode==='approach'){
        a.pose='hop';
        this._move(a,0.4);
        if(Math.abs(a.col-a.targetCol)<0.2){a.mode='pause';a.timer=32;}
        return;
      }
      if(a.mode==='retreat'){
        a.pose='hop';
        a.targetCol=a.edgeCol+1;
        this._move(a,0.42);
        if(Math.abs(a.col-a.targetCol)<0.2){a.mode='hide';a.timer=68;}
        return;
      }
      a.pose=hover?'twitch':'base';
      if(--a.timer<=0)a.mode='retreat';
      return;
    }
    if(--a.timer<=0){
      a.targetCol=a.targetCol===a.spotA?a.spotB:a.spotA;
      a.timer=a.tier>=3?76:40;
    }
    a.pose=hover?'twitch':(a.tier>=3?(state.frame%92<24?'groom':'rest'):(state.frame%36<12?'hop':'twitch'));
    this._move(a,a.tier>=3?0.08:0.2);
  }
  _updateTurtle(a,state,hover){
    if(a.tier===0){this._runEdgePeek(a,state,'peek','step','turn');return;}
    if(a.tier===1){
      if(a.mode==='approach'){
        a.pose='step';
        this._move(a,0.1);
        if(Math.abs(a.col-a.targetCol)<0.15){a.mode='pause';a.timer=46;}
        return;
      }
      if(a.mode==='retreat'){
        a.pose='turn';
        a.targetCol=a.spotA;
        this._move(a,0.08);
        if(Math.abs(a.col-a.targetCol)<0.15){a.mode='pause';a.timer=40;}
        return;
      }
      a.pose=hover?'turn':'bob';
      if(--a.timer<=0){
        a.mode=a.mode==='pause'&&Math.abs(a.col-a.spotA)<0.15?'approach':'retreat';
        a.targetCol=a.mode==='approach'?a.spotB:a.spotA;
      }
      return;
    }
    if(--a.timer<=0){
      a.targetCol=a.targetCol===a.spotA?a.spotB:a.spotA;
      a.timer=a.tier>=3?90:54;
    }
    a.pose=hover?'turn':(a.tier>=3?(state.frame%100<24?'bob':'rest'):(state.frame%50<18?'step':'turn'));
    this._move(a,a.tier>=3?0.05:0.08);
  }
  _updateAnimalActor(a,state){
    const hover=this._hoveringAnimal(a,state);
    this._consumeFeedEvent(a,state);
    if(this._runFeedReaction(a))return;
    if(a.feedGlyph&&--a.feedGlyph.timer<=0)a.feedGlyph=null;
    if(a.type==='cat')this._updateCat(a,state,hover);
    else if(a.type==='bird')this._updateBird(a,state,hover);
    else if(a.type==='rabbit')this._updateRabbit(a,state,hover);
    else this._updateTurtle(a,state,hover);
  }
  update(state){
    if(!this._init)this._initCreatures(state);
    const gy=state.groundY;
    for(const c of this._cr){
      if(!c.active)continue;
      if(c.kind==='butterfly'){
        c.fi=Math.floor(state.frame/6)%c.frames.length;
        c.x+=c.vx;c.y+=0.15*Math.sin(state.frame*0.05+c.phase);
        c.y=Math.max(2,Math.min(gy-5,c.y));
        if(c.x<1){c.x=1;c.vx=Math.abs(c.vx);}
        if(c.x>state.cols-3){c.x=state.cols-3;c.vx=-Math.abs(c.vx);}
      }else if(c.kind==='bird'){
        c.fi=Math.floor(state.frame/c.frameStep)%c.frames.length;c.x+=c.vx;
        const w=artWidth(c.frames);
        if(c.x<-w-2||c.x>state.cols+w+2)c.active=false;
      }else if(c.kind==='firefly'){
        c.x+=c.vx;c.y+=c.vy+0.05*Math.sin(state.frame*0.02+c.phase);
        c.y=Math.max(1,Math.min(gy-2,c.y));
      }
    }
    this._cr=this._cr.filter(c=>c.active!==false);
    this._birdT++;
    if(this._birdT>250+Math.floor(Math.random()*350)&&state.season!=='winter'){
      this._birdT=0;
      this._spawnAmbientBirds(state,1,false);
    }
    const animal=this._ensureAnimal(state);
    if(animal)this._updateAnimalActor(animal,state);
  }
  render(buf,state){
    for(const c of this._cr){
      if(!c.active)continue;
      const r=Math.round(c.y),col=Math.round(c.x);
      if(c.kind==='butterfly') buf.putStrAnim(r,col,c.frames[c.fi],c.color);
      else if(c.kind==='bird') buf.putStrAnim(r,col,c.frames[c.fi],'gray');
      else if(c.kind==='firefly')
        if(state.frame%(c.on+c.off)<c.on) buf.putAnim(r,col,'*','bright_yellow');
    }
    const a=this._animal;
    if(!a)return;
    const artLines=animalFrame(a.type,a.tier,a.pose);
    if(a.feedGlyph){
      a.feedGlyph.lines.forEach((ln,i)=>buf.putStrAnim(a.feedGlyph.row+i,a.feedGlyph.col,ln,a.feedGlyph.color||'bright_yellow'));
    }
    if(a.wasAbsent&&a.tier>0){
      const fp=_ANIMAL_FOOTPRINTS[a.type]||'...';
      buf.putStrAnim(Math.round(a.homeRow)+artLines.length,Math.max(0,Math.round(a.homeCol)),fp,'dim');
    }
    if(!a.visible)return;
    const baseCol=clamp(Math.round(a.col),0,Math.max(0,state.cols-artWidth(artLines)-1));
    artLines.forEach((ln,i)=>buf.putStrAnim(Math.round(a.row)+i,baseCol,ln,'brown'));
  }
}

class SpecialLayer{
  render(buf,state){
    if(!state.postComplete)return;
    const cx=state.cols>>1,gy=state.groundY;
    buf.put(gy-1,cx,'|','green');
    buf.putStr(gy-2,cx-1,'(@)','bright_red');
    buf.putStr(gy-3,cx-1,'@@@','red');
    // Generic perch bird unless bonded animal is present (rendered by CreatureLayer)
    const ad=state.animalData;
    if(!ad||ad.tier<3||!ad.triggered) buf.put(gy-9,cx+6,'v','bright_white');
  }
}

// Pre-build HTML escape map for speed
const ESC_MAP={'&':'&amp;','<':'&lt;','>':'&gt;'};
function esc1(ch){ return ESC_MAP[ch]||ch; }

class GardenDOM {
  constructor(el){
    this.el=el;
    this._rowEls=[];
    this._lastGy=-1; this._lastNight=false; this._lastTimeOfDay='day';
    this._cw=CW; this._ch=CH;
    this._measure();
  }

  _measure(){
    // Measure from inside #g so font-rendering context is identical to garden rows
    const s=document.createElement('span');
    s.textContent='WWWWWWWWWW';
    s.style.cssText='position:absolute;top:-9999px;left:0;visibility:hidden;white-space:pre;pointer-events:none';
    this.el.appendChild(s);
    const cw=s.getBoundingClientRect().width/10;
    this.el.removeChild(s);
    // CH: measure a real div — inherits height:15px from #g>div CSS rule
    const d=document.createElement('div');
    d.style.cssText='position:absolute;top:-9999px;left:0;visibility:hidden;pointer-events:none';
    d.textContent=' ';
    this.el.appendChild(d);
    const ch=d.getBoundingClientRect().height||15;
    this.el.removeChild(d);
    this._cw=cw;this._ch=ch;
    CW=cw;CH=ch;
  }

  get cols(){ return Math.floor(this.el.clientWidth/this._cw); }
  get rows(){ return Math.floor(this.el.clientHeight/this._ch); }

  resize(){ this._measure(); }

  setGroundBg(gy,rows,timeOfDay='day'){
    if(gy===this._lastGy&&_devNight===this._lastNight&&timeOfDay===this._lastTimeOfDay)return;
    this._lastGy=gy; this._lastNight=_devNight; this._lastTimeOfDay=timeOfDay;
    const sky=timeOfDay==='evening'?'#ecd6b6':C.sky;
    const ground=timeOfDay==='evening'?'#d8bea2':C.dim_green;
    const pct=((gy+1)/rows*100).toFixed(2);
    this.el.style.background=
      `linear-gradient(to bottom,${sky} ${pct}%,${ground} ${pct}%)`;
  }

  blit(buf,gy){
    this.setGroundBg(gy,buf.rows,getTimeOfDay());

    // Sync row element count
    while(this._rowEls.length<buf.rows){
      const d=document.createElement('div');
      this.el.appendChild(d);
      this._rowEls.push(d);
    }
    while(this._rowEls.length>buf.rows){
      this.el.removeChild(this._rowEls.pop());
    }

    // Render each row as colored spans
    for(let r=0;r<buf.rows;r++){
      let html='';
      let curCol=null,curText='';

      for(let c=0;c<buf.cols;c++){
        const i=r*buf.cols+c;
        const ch=buf._ch[i];

        if(ch===' '){
          if(curText){html+=`<span style="color:${curCol}">${curText}</span>`;curText='';curCol=null;}
          html+=' ';
          continue;
        }

        // Mode 3: non-animated cells go B&W; animated cells keep palette color
        const rawCol=buf._col[i];
        const col=(_colorMode===3&&!buf._anim[i])?'var(--text)':(C[rawCol]||'#404040');
        if(col!==curCol){
          if(curText){html+=`<span style="color:${curCol}">${curText}</span>`;curText='';}
          curCol=col;
        }
        curText+=esc1(ch);
      }
      if(curText)html+=`<span style="color:${curCol}">${curText}</span>`;
      this._rowEls[r].innerHTML=html;
    }
  }
}

function getSeason(){
  // Dev override (< / > keys) takes precedence
  if(_devSeason)return _devSeason.replace(/-(evening|night)$/,'');
  // ?season= URL param lets QA force a season without editing JS or clock
  const p=new URLSearchParams(location.search).get('season');
  if(p&&['spring','summer','autumn','winter'].includes(p))return p;
  const m=new Date().getMonth()+1;
  if(m>=3&&m<=5)return'spring';if(m>=6&&m<=8)return'summer';
  if(m>=9&&m<=11)return'autumn';return'winter';
}
function getTimeOfDay(){
  if(_devSeason){
    if(_devSeason.endsWith('-night'))return'night';
    if(_devSeason.endsWith('-evening'))return'evening';
    return'day';
  }
  const p=new URLSearchParams(location.search).get('time');
  if(p&&['day','evening','night'].includes(p))return p;
  const hour=new Date().getHours();
  if(hour>=19&&hour<21)return'evening';
  if(hour>=21||hour<5)return'night';
  return'day';
}

class GardenEngine{
  constructor(el){
    this.dom=new GardenDOM(el);
    this.el=el;
    this.buf=null; this.state=null;
    this.bg=new BackgroundLayer();
    this.plants=new PlantLayer();
    this.particles=new ParticleLayer();
    this.creatures=new CreatureLayer();
    this.special=new SpecialLayer();
    this._raf=null; this._last=0; this._seed=12345;
    this._postComplete=false; this._animalData=null;
    this._bindMouse();
  }

  _bindMouse(){
    this.el.addEventListener('mousemove',e=>{
      if(!this.state)return;
      const rect=this.el.getBoundingClientRect();
      this.state.mouseRow=Math.floor((e.clientY-rect.top)/CH);
      this.state.mouseCol=Math.floor((e.clientX-rect.left)/CW);
      const key=`${this.state.mouseRow},${this.state.mouseCol}`;
      this.el.style.cursor=this.state.collisionMap.has(key)?'pointer':'crosshair';
    });
    this.el.addEventListener('mouseleave',()=>{
      if(this.state){this.state.mouseRow=-1;this.state.mouseCol=-1;}
      this.el.style.cursor='crosshair';
    });
    this.el.addEventListener('click',e=>{
      if(!this.state)return;
      const rect=this.el.getBoundingClientRect();
      const mr=Math.floor((e.clientY-rect.top)/CH);
      const mc=Math.floor((e.clientX-rect.left)/CW);
      this.particles.spawnAt(mr,mc,this.state);
    });
  }

  setSeed(seed){ this._seed=seed; this._reset(); }

  _reset(){
    this.dom.resize();
    const season=getSeason();
    const timeOfDay=getTimeOfDay();
    this.state=new GardenState(this.dom.cols,this.dom.rows,this._seed,season);
    _applyNightPalette(timeOfDay==='night');
    this.state.night=timeOfDay==='night';
    this.state.timeOfDay=timeOfDay;
    this.state.postComplete=this._postComplete;
    this.state.animalData=this._animalData;
    this.buf=new ScreenBuffer(this.dom.rows,this.dom.cols);
    this.plants.regenerate(this.state);
    this.particles.reset(); this.creatures.reset();
  }

  start(){
    if(this._raf)return;
    const tick=now=>{
      this._raf=requestAnimationFrame(tick);
      if(now-this._last<50)return; // ~20fps
      this._last=now; this._tick();
    };
    this._raf=requestAnimationFrame(tick);
  }

  stop(){ if(this._raf){cancelAnimationFrame(this._raf);this._raf=null;} }

  _tick(){
    const s=this.state; s.frame++;
    // Gusty wind: product of two slow oscillators (asciicker foliage_wind_state
    // uses n0*n1 with a positive offset for a prevailing direction).
    const n0=Math.sin(s.frame*0.008)+0.35*Math.sin(s.frame*0.0173+1.3);
    const n1=Math.sin(s.frame*0.0052+4.1)+0.35*Math.sin(s.frame*0.0117+2.2);
    s.wind=clamp(n0*n1*0.45+0.08,-0.65,0.65);
    this.particles.update(s); this.creatures.update(s);
    this.buf.clear();
    this.bg.render(this.buf,s);
    this.plants.render(this.buf,s);
    this.particles.render(this.buf,s);
    this.creatures.render(this.buf,s);
    this.special.render(this.buf,s);
    this.dom.blit(this.buf,s.groundY);
  }

  onResize(){ this._reset(); }
  setPostComplete(v){ this._postComplete=v; if(this.state) this.state.postComplete=v; }
  setAnimalData(data){ this._animalData=data; if(this.state) this.state.animalData=data; }
  triggerAnimalFeedReaction(data){ this.creatures.queueFeedReaction(data); }
  spawnAmbientBirdBurst(){ if(this.state) this.creatures.spawnAmbientBirdBurst(this.state); }
  animalDebugState(){ return this.creatures.debugAnimalState(); }
}

const NS='lateletter_v1_';
const SIDS=['s-welcome','s-passphrase','s-status','s-select','s-reading','s-archive','s-error'];

let bundle=null,isDevFixture=false,decoded={};
let readIds=new Set(),giftDiscovered={};
let visitCount=0,firstRun=true,postComplete=false;
let dueIdxs=[],curMsg=null,cachedPassphrase=null;
let _firstReadGuide=false;
let garden=null;
let bundleCorrupted=false,bundleCorruptionReason='';

// ── Storage ───────────────────────────────────────────────────────────
let _db=null,storageOk=false;
async function storageInit(){
  try{
    _db=await new Promise((res,rej)=>{
      const r=indexedDB.open('LateLetter',1);
      r.onupgradeneeded=e=>{if(!e.target.result.objectStoreNames.contains('kv'))
        e.target.result.createObjectStore('kv');};
      r.onsuccess=e=>res(e.target.result); r.onerror=e=>rej(e.target.error);
    }); storageOk=true;
  }catch(_){
    try{localStorage.setItem(NS+'_t','1');localStorage.removeItem(NS+'_t');storageOk=true;}
    catch(_2){storageOk=false;}
  }
}
async function kvGet(k){
  if(!storageOk)return null;
  if(_db)return new Promise((res,rej)=>{
    const tx=_db.transaction('kv','readonly'),r=tx.objectStore('kv').get(k);
    r.onsuccess=e=>res(e.target.result??null); r.onerror=e=>rej(e.target.error);
  });
  return localStorage.getItem(k);
}
async function kvSet(k,v){
  if(!storageOk)return;
  if(_db)return new Promise((res,rej)=>{
    const tx=_db.transaction('kv','readwrite'),r=tx.objectStore('kv').put(v,k);
    r.onsuccess=()=>res(); r.onerror=e=>rej(e.target.error);
  });
  try{localStorage.setItem(k,v);}catch(_){}
}
const kRead     =(bid,mid)=>`${NS}${bid}_read_${mid}`;
const kVisits   =(bid)    =>`${NS}${bid}_visits`;
const kFirst    =()       =>`${NS}first_run`;
const kGift     =(bid,gid)=>`${NS}${bid}_gift_${gid}`;
const kAnimal   =(bid)    =>`${NS}${bid}_animal`;
const kLastVisit=(bid)    =>`${NS}${bid}_last_visit`;

// ── Worker ────────────────────────────────────────────────────────────
const WORKER_SRC=`
self.onmessage=function(e){
  var d=e.data,id=d.requestId;
  if(d.type==='dev_decode'){
    var out=[];
    for(var i=0;i<d.messages.length;i++){
      var m=d.messages[i];
      try{var bin=atob(m.ciphertext),buf=new Uint8Array(bin.length);
        for(var j=0;j<bin.length;j++)buf[j]=bin.charCodeAt(j);
        var p=JSON.parse(new TextDecoder().decode(buf));
        out.push({id:m.id,ok:true,label:p.label||'',body:p.body||''});}
      catch(err){out.push({id:m.id,ok:false,label:'',body:'[decode error: '+err.message+']'});}
    }
    self.postMessage({requestId:id,ok:true,messages:out});return;
  }
  self.postMessage({requestId:id,ok:false,error:'Real decryption not yet implemented (step 13).'});
};`;
let _wk=null,_pend=new Map(),_rid=0;
function getWorker(){
  if(!_wk){
    const b=new Blob([WORKER_SRC],{type:'application/javascript'});
    _wk=new Worker(URL.createObjectURL(b));
    _wk.onmessage=e=>{
      const{requestId,ok,error,...rest}=e.data,p=_pend.get(requestId);
      if(p){_pend.delete(requestId);ok?p.resolve(rest):p.reject(new Error(error||'Worker error'));}
    };
    _wk.onerror=e=>console.error('Worker:',e);
  }
  return _wk;
}
function wCall(type,payload){
  return new Promise((res,rej)=>{
    const id=_rid++;_pend.set(id,{resolve:res,reject:rej});
    getWorker().postMessage({type,requestId:id,...payload});
  });
}

// ── Bundle checksum / corruption handling ────────────────────────────
function _visiblePayload(data){
  return {
    version:data.version,
    bundle_id:data.bundle_id,
    author_name:data.author_name,
    passphrase_hint:data.passphrase_hint ?? null,
    bundle_auth_salt:data.bundle_auth_salt,
    garden_seed:data.garden_seed,
    messages:data.messages || [],
    garden_gifts:data.garden_gifts || [],
    notification:data.notification ?? null,
  };
}
function _canonicalJson(v){
  if(v===null)return'null';
  if(Array.isArray(v))return`[${v.map(_canonicalJson).join(',')}]`;
  switch(typeof v){
    case 'string': return JSON.stringify(v);
    case 'number': return Number.isFinite(v)?String(v):'null';
    case 'boolean': return v?'true':'false';
    case 'object': {
      const keys=Object.keys(v).sort();
      return `{${keys.map(k=>`${JSON.stringify(k)}:${_canonicalJson(v[k])}`).join(',')}}`;
    }
    default: return 'null';
  }
}
async function _sha256Hex(text){
  const bytes=new TextEncoder().encode(text);
  const digest=await crypto.subtle.digest('SHA-256',bytes);
  return Array.from(new Uint8Array(digest),b=>b.toString(16).padStart(2,'0')).join('');
}
async function verifyBundleChecksum(data,allowMissing){
  if(!data.checksum)return{ok:!!allowMissing,missing:true};
  const actual=await _sha256Hex(_canonicalJson(_visiblePayload(data)));
  return{ok:actual===data.checksum,missing:false};
}

// ── Bundle loading ────────────────────────────────────────────────────
async function loadBundle(file){
  const text=await file.text(),data=JSON.parse(text);
  if(!data||typeof data!=='object')throw new Error('Not a valid .lateletter file.');
  if(data.version!==1)throw new Error(`Unsupported version: ${data.version??'(missing)'}`);
  if(!data.bundle_id)throw new Error('Bundle missing bundle_id.');
  bundle=data; isDevFixture=!bundle.hmac;
  bundleCorrupted=false; bundleCorruptionReason='';
  const checksum=await verifyBundleChecksum(bundle,isDevFixture);
  if(!checksum.ok){
    bundleCorrupted=true;
    bundleCorruptionReason='this file appears damaged. the garden can still be viewed, but the letters stay sealed.';
  }else if(checksum.missing&&isDevFixture){
    console.warn('[viewer] dev fixture missing checksum; corruption gate relaxed for local demo flow');
  }
  readIds=new Set();
  for(const m of bundle.messages||[])
    if(await kvGet(kRead(bundle.bundle_id,m.id))) readIds.add(m.id);
  const v=await kvGet(kVisits(bundle.bundle_id));
  visitCount=v?(parseInt(v,10)||0):0; visitCount++;
  await kvSet(kVisits(bundle.bundle_id),String(visitCount));
  const fr=await kvGet(kFirst()); firstRun=!fr;
  if(firstRun) await kvSet(kFirst(),'1');
  giftDiscovered={};
  for(const g of bundle.garden_gifts||[])
    giftDiscovered[g.id]=!!(await kvGet(kGift(bundle.bundle_id,g.id)));
  // Evaluate date + cumulative_visits triggers eagerly (no auth needed)
  const _td=new Date();_td.setHours(0,0,0,0);
  for(const g of bundle.garden_gifts||[]){
    if(giftDiscovered[g.id])continue;
    const t=g.trigger||{};let hit=false;
    if(t.type==='date')hit=new Date(t.value+'T00:00:00')<=_td;
    else if(t.type==='cumulative_visits')hit=visitCount>=parseInt(t.value,10);
    if(hit){giftDiscovered[g.id]=true;await kvSet(kGift(bundle.bundle_id,g.id),'1');}
  }
  // Animal state
  animalType=null;animalTier=0;animalTriggered=false;animalTrustActions=0;wasAbsent=false;
  _devAnimal=null;_frbDone=false;_devSeason=null;_devNight=false;_deliveryPlayed=false;
  _applyNightPalette(false);
  const _ag=(bundle.garden_gifts||[]).find(g=>g.type==='animal');
  if(_ag){
    animalType=_ag.catalog_id||null;
    animalTriggered=!!giftDiscovered[_ag.id];
    const _as=await kvGet(kAnimal(bundle.bundle_id));
    if(_as){try{const a=JSON.parse(_as);animalTrustActions=a.trust_actions||0;animalTier=animalTrustTier(animalTrustActions);}catch(_){}}
    const _lv=await kvGet(kLastVisit(bundle.bundle_id));
    if(_lv){const lv=new Date(_lv+'T00:00:00'),td=new Date();td.setHours(0,0,0,0);lv.setHours(0,0,0,0);wasAbsent=(td-lv)>86400000;}
    await kvSet(kLastVisit(bundle.bundle_id),new Date().toISOString().slice(0,10));
  }
}

// ── Auth ──────────────────────────────────────────────────────────────
// Sealed-bundle crypto (SPEC §4, step 13): PBKDF2-SHA256 + AES-256-GCM,
// recorded per-message in kdf_params. WebCrypto-native — no network, no WASM.
function _b64ToBytes(s){
  const bin=atob(s),buf=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)buf[i]=bin.charCodeAt(i);
  return buf;
}
function _bundleKdfParams(){
  for(const m of bundle.messages||[]){
    const k=m.kdf_params;
    if(k&&k.name==='PBKDF2'&&k.hash==='SHA-256'&&k.iterations>0)return k;
  }
  return null;
}
async function _pbkdf2Key(pp,saltBytes,iterations){
  const base=await crypto.subtle.importKey(
    'raw',new TextEncoder().encode(pp),'PBKDF2',false,['deriveBits']);
  return new Uint8Array(await crypto.subtle.deriveBits(
    {name:'PBKDF2',hash:'SHA-256',salt:saltBytes,iterations},base,256));
}
async function _timingSafeHexEq(aHex,bHex){
  // Compare digests of both sides so mismatch position leaks nothing.
  const da=await _sha256Hex('cmp:'+aHex),db=await _sha256Hex('cmp:'+bHex);
  return da===db;
}
async function _gcmDecrypt(keyBytes,nonceB64,ctB64){
  const key=await crypto.subtle.importKey('raw',keyBytes,'AES-GCM',false,['decrypt']);
  const pt=await crypto.subtle.decrypt(
    {name:'AES-GCM',iv:_b64ToBytes(nonceB64)},key,_b64ToBytes(ctB64));
  return new TextDecoder().decode(pt);
}
async function verifyPassphrase(pp){
  if(isDevFixture){
    const r=await wCall('dev_decode',{messages:bundle.messages||[]});
    decoded={};
    for(const m of r.messages) decoded[m.id]={label:m.label,body:m.body};
    for(const g of bundle.garden_gifts||[]){
      if(!g.sentiment_ciphertext)continue;
      try{g._sentiment=new TextDecoder().decode(_b64ToBytes(g.sentiment_ciphertext));}
      catch(_){g._sentiment='';}
    }
    cachedPassphrase=pp; return true;
  }
  const kdf=_bundleKdfParams();
  if(!kdf)throw new Error('This file uses an encryption this viewer cannot open yet.');
  if(!crypto.subtle)throw new Error('This browser cannot unlock letters (no WebCrypto).');
  // 1. Bundle HMAC gate — nothing is announced until this passes (SPEC §4).
  const hmacKeyBytes=await _pbkdf2Key(pp,_b64ToBytes(bundle.bundle_auth_salt),kdf.iterations);
  const hmacKey=await crypto.subtle.importKey(
    'raw',hmacKeyBytes,{name:'HMAC',hash:'SHA-256'},false,['sign']);
  const mac=new Uint8Array(await crypto.subtle.sign(
    'HMAC',hmacKey,new TextEncoder().encode(_canonicalJson(_visiblePayload(bundle)))));
  const macHex=Array.from(mac,b=>b.toString(16).padStart(2,'0')).join('');
  if(!await _timingSafeHexEq(macHex,bundle.hmac))
    throw new Error('incorrect passphrase, or file modified');
  // 2. Decrypt messages (per-message salt → per-message key).
  decoded={};
  for(const m of bundle.messages||[]){
    const key=await _pbkdf2Key(pp,_b64ToBytes(m.salt),(m.kdf_params||kdf).iterations);
    const p=JSON.parse(await _gcmDecrypt(key,m.nonce,m.ciphertext));
    decoded[m.id]={label:p.label||'',body:p.body||''};
  }
  // 3. Decrypt gift sentiments (per-gift salt, bundle-wide KDF params).
  for(const g of bundle.garden_gifts||[]){
    if(!g.sentiment_ciphertext){g._sentiment='';continue;}
    const key=await _pbkdf2Key(pp,_b64ToBytes(g.salt),kdf.iterations);
    try{g._sentiment=await _gcmDecrypt(key,g.nonce,g.sentiment_ciphertext);}
    catch(_){g._sentiment='';}
  }
  cachedPassphrase=pp; return true;
}

// ── Due / complete ────────────────────────────────────────────────────
function computeDue(){
  const today=new Date();today.setHours(0,0,0,0);
  return(bundle.messages||[]).reduce((acc,m,i)=>{
    try{const d=new Date(m.date+'T00:00:00');if(d<=today&&!readIds.has(m.id))acc.push(i);}catch(_){}
    return acc;
  },[]);
}
function isPostComplete(){
  const msgs=bundle.messages||[];return msgs.length>0&&msgs.every(m=>readIds.has(m.id));
}

// ── Triggers ──────────────────────────────────────────────────────────
async function evalTriggers(justRead=null){
  const today=new Date();today.setHours(0,0,0,0);
  for(const g of bundle.garden_gifts||[]){
    if(giftDiscovered[g.id])continue;
    const t=g.trigger||{};let hit=false;
    if(t.type==='date')hit=new Date(t.value+'T00:00:00')<=today;
    else if(t.type==='cumulative_visits')hit=visitCount>=parseInt(t.value,10);
    else if(t.type==='post_letter'&&justRead)hit=t.value===justRead;
    if(hit){giftDiscovered[g.id]=true;await kvSet(kGift(bundle.bundle_id,g.id),'1');}
  }
  // Re-evaluate animal triggered state
  if(animalType){
    const _ag=(bundle.garden_gifts||[]).find(g=>g.type==='animal');
    if(_ag&&!animalTriggered&&giftDiscovered[_ag.id]){
      animalTriggered=true;
      if(garden)garden.setAnimalData(_animalData());
      _updateAnimalHud();
    }
  }
}
function _animalData(){
  if(!animalType)return null;
  return{type:animalType,tier:animalTier,triggered:animalTriggered,wasAbsent};
}

// ── Screen management ─────────────────────────────────────────────────
function showScreen(name){
  _cancelDelivery();

// ── Animal delivery animation (FL-G21) ───────────────────────────────
let _deliveryIv=null,_deliveryOv=null;
function _cancelDelivery(){
  if(_deliveryIv){clearInterval(_deliveryIv);_deliveryIv=null;}
  if(_deliveryOv){_deliveryOv.remove();_deliveryOv=null;}
}
function _playDelivery(cb){
  _cancelDelivery();
  // SPEC §6.3: a bonded (tier 3) animal delivers; otherwise the letter-bird.
  const bonded=animalType&&animalTriggered&&animalTier>=3&&_ANIMAL_DELIVERY_FRAMES[animalType];
  const frames=bonded?_ANIMAL_DELIVERY_FRAMES[animalType]:_LETTERBIRD_FRAMES;
  const ov=document.createElement('div');
  ov.style.cssText='position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:12;pointer-events:none;opacity:0;transition:opacity .4s;';
  const pre=document.createElement('pre');
  pre.style.cssText='font:13px/15px "Courier New",monospace;color:var(--text);opacity:.8;text-align:center;';
  ov.appendChild(pre);document.body.appendChild(ov);
  _deliveryOv=ov;
  // Three phases: approach (slide in, flapping) → settle (small dip) →
  // present (hold pose, envelope glints). Sub-cell approach motion comes
  // from a CSS transform so the char frames stay clean.
  pre.style.transform=`translateX(${bonded?'-24vw':'-38vw'}) translateY(${bonded?'0':'-6vh'})`;
  pre.style.transition='transform 1.5s cubic-bezier(.25,.8,.35,1)';
  let fi=0,tick=0;
  pre.textContent=frames[0].join('\n');
  requestAnimationFrame(()=>{ov.style.opacity='1';pre.style.transform='translate(0,0)';});
  _deliveryIv=setInterval(()=>{
    try{
      tick++;
      if(tick===11){pre.style.transition='transform .22s ease-out';pre.style.transform='translateY(4px)';}
      if(tick===13)pre.style.transform='translateY(0)';
      if(tick<11)fi=(fi+1)%frames.length;else fi=0;
      let txt=frames[fi].join('\n');
      if(tick>=13&&tick%4>=2)txt=txt.replace('[✉]','{✉}');
      pre.textContent=txt;
      if(tick>=22){_cancelDelivery();ov.style.opacity='0';setTimeout(()=>{ov.remove();cb();},400);}
    }catch(_){_cancelDelivery();}
  },150);
}
