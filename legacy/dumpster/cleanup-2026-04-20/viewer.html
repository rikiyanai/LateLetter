<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LateLetter</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --text: #ddd5c0;
      --bg:   #08090a;
      --mono: 'Courier New', Courier, monospace;
    }

    html, body {
      width: 100%; height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--mono);
      font-size: 15px;
      line-height: 1.65;
      overflow: hidden;
    }

    /* ── Canvas ── */
    #gc {
      position: fixed; inset: 0;
      width: 100%; height: 100%;
      display: block;
      cursor: crosshair;
      transition: filter .4s;
    }
    #gc.dim { filter: brightness(.22); }

    /* ── Screen overlays ── */
    .screen {
      position: fixed; inset: 0;
      display: none; flex-direction: column;
      align-items: center; justify-content: center;
      z-index: 10; padding: 2rem;
      pointer-events: none;
    }
    .screen.active { display: flex; pointer-events: auto; }

    /*
      Scrim: blur + darken the garden behind text.
      No border. No box. Just readability.
    */
    .scrim {
      background: rgba(5, 8, 16, .74);
      backdrop-filter: blur(22px) brightness(.45);
      -webkit-backdrop-filter: blur(22px) brightness(.45);
      padding: 2.25rem 2.75rem;
      width: min(560px, 96vw);
      max-height: 88vh;
      overflow-y: auto;
    }

    /* ── Typography hierarchy — opacity only, same hue ── */
    .t1  { color: var(--text); opacity: 1;    font-size: 1rem;  }
    .t2  { color: var(--text); opacity: .55;  font-size: .85rem; }
    .t3  { color: var(--text); opacity: .3;   font-size: .75rem; letter-spacing: .06em; }
    .t4  { color: var(--text); opacity: .18;  font-size: .72rem; }

    /* ── Buttons — [bracket style] ── */
    .btn {
      background: none; border: none;
      font: inherit; font-size: .85rem;
      color: var(--text); opacity: .45;
      cursor: pointer; padding: 0;
      transition: opacity .12s;
      letter-spacing: .02em;
    }
    .btn::before { content: '['; }
    .btn::after  { content: ']'; }
    .btn:hover   { opacity: 1; }
    .btn.hi      { opacity: 1; }
    .btn-row     { display: flex; gap: 1.75rem; flex-wrap: wrap; }

    /* ── Inputs — underline only ── */
    .fi {
      width: 100%;
      background: transparent;
      border: none;
      border-bottom: 1px solid rgba(221, 213, 192, .2);
      color: var(--text);
      font: inherit; font-size: 1rem;
      padding: .35rem 0;
      margin-bottom: 1.4rem;
      outline: none;
    }
    .fi:focus { border-bottom-color: rgba(221, 213, 192, .55); }

    /* ── Welcome ── */
    #s-welcome {
      /* No scrim — text directly on canvas */
      background: none;
    }
    .welcome-inner {
      text-align: center;
    }
    .welcome-inner p { margin-bottom: .5rem; }
    #drop-zone {
      /* Invisible — just catches events */
      padding: 3rem 4rem;
      cursor: pointer;
    }
    #drop-zone.over * { opacity: 1 !important; }
    #file-input { display: none; }

    /* ── HUD (garden view — floats over canvas) ── */
    #hud {
      position: fixed;
      bottom: 40%;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      z-index: 5;
      white-space: nowrap;
      opacity: 0;
      transition: opacity 1.4s ease;
      pointer-events: none;
    }
    #hud.vis { opacity: 1; pointer-events: auto; }
    #hud-author { margin-bottom: .6rem; }
    #hud-btns   { display: flex; gap: 1.75rem; justify-content: center; }

    /* ── Passphrase ── */
    #s-passphrase .scrim { max-width: 440px; }
    .pp-title { margin-bottom: .2rem; }
    .pp-sub   { margin-bottom: 1.6rem; }
    .pp-label { margin-bottom: .3rem; }
    .pp-hint  { margin-bottom: 1.2rem; }
    .pp-err   { color: var(--text); opacity: .6; margin-bottom: .8rem;
                display: none; font-size: .82rem; }
    .pp-err.on { display: block; }
    .pp-info  { opacity: .35; font-size: .82rem; margin-bottom: .8rem;
                display: none; }
    .pp-info.on { display: block; }
    .warn-st  { opacity: .35; font-size: .78rem; margin-bottom: 1rem;
                display: none; }
    .warn-st.on { display: block; }

    /* ── Status ── */
    #s-status .scrim { max-width: 420px; text-align: center; }
    .st-h   { margin-bottom: .4rem; }
    .st-sub { margin-bottom: 1.4rem; }
    #st-btns { justify-content: center; }

    /* ── Letter select ── */
    #s-select .scrim { max-width: 420px; }
    .pick-list  { list-style: none; margin-bottom: 1.25rem; }
    .pick-list li { padding: .5rem 0; }
    .pick-btn {
      background: none; border: none;
      font: inherit; font-size: .9rem;
      color: var(--text); opacity: .65;
      cursor: pointer; padding: 0;
      text-align: left;
    }
    .pick-btn:hover { opacity: 1; }

    /* ── Reading ── */
    #s-reading {
      align-items: stretch;
      justify-content: stretch;
      padding: 3rem 2.5rem;
    }
    #s-reading .scrim {
      width: min(680px, 96vw);
      max-width: none;
      display: flex;
      flex-direction: column;
      max-height: 86vh;
    }
    .lm-from   { margin-bottom: .15rem; }
    .lm-label  { font-size: 1.05rem; margin-bottom: .15rem; }
    .lm-date   { margin-bottom: 2rem; }

    .letter-body {
      font-size: 14px;
      line-height: 26px;
      color: var(--text);
      flex: 1;
      overflow-y: auto;
      margin-bottom: 2rem;
    }
    /* pretext lines — white-space: pre preserves intentional spacing */
    .letter-body .ll { white-space: pre; display: block; }

    .la { /* letter actions */ }

    /* ── Archive ── */
    #s-archive .scrim { max-width: 520px; }
    .arc-title  { margin-bottom: 1.5rem; }
    .arc-st     { margin: 1.25rem 0 .5rem; }
    .arc-list   { list-style: none; }
    .arc-item   {
      display: flex; gap: .65rem; align-items: baseline;
      padding: .45rem 0;
    }
    .arc-mk     { flex-shrink: 0; width: 1.1rem; opacity: .5; }
    .arc-mk.read   { opacity: 1; }
    .arc-mk.unread { opacity: .7; }
    .arc-body   { flex: 1; }
    .arc-btn    {
      background: none; border: none; font: inherit;
      text-align: left; cursor: pointer; padding: 0;
      color: var(--text); opacity: .7; width: 100%;
    }
    .arc-btn:hover { opacity: 1; }
    .arc-lbl    { font-size: .88rem; }
    .arc-sub    { font-size: .75rem; opacity: .45; display: block; }
    .arc-foot   { margin-top: 1.5rem; opacity: .3; font-size: .82rem;
                  font-style: italic; display: none; }

    /* ── Memory modal ── */
    #modal-mem {
      display: none; position: fixed; inset: 0; z-index: 50;
      align-items: center; justify-content: center; padding: 2rem;
      background: rgba(5, 8, 16, .6);
      backdrop-filter: blur(4px);
    }
    #modal-mem.open { display: flex; }
    .mem-inner {
      background: rgba(5, 8, 16, .82);
      backdrop-filter: blur(24px) brightness(.4);
      padding: 2rem 2.5rem;
      width: min(400px, 96vw);
    }
    .mem-type { margin-bottom: 1rem; }
    .mem-text { font-size: .88rem; line-height: 1.75;
                margin-bottom: 1.4rem; opacity: .8; }

    /* ── Error ── */
    #s-error .scrim { max-width: 440px; text-align: center; }
    .err-h  { margin-bottom: .5rem; }
    .err-d  { font-size: .8rem; word-break: break-word; margin-bottom: 1.5rem; }

    /* ── Dev badge ── */
    .dev-b {
      font-size: .62rem; padding: .08rem .28rem;
      background: rgba(221, 213, 192, .06);
      color: var(--text); opacity: .45;
      vertical-align: middle; margin-left: .35rem;
    }

    @media (max-width: 480px) {
      .scrim { padding: 1.75rem 1.5rem; }
      #s-reading { padding: 1.5rem 1rem; }
    }
  </style>
</head>
<body>

<canvas id="gc" class="dim"></canvas>

<!-- HUD: floats over garden, no overlay -->
<div id="hud">
  <p id="hud-author" class="t2"></p>
  <div id="hud-btns"></div>
</div>

<!-- Welcome: text directly on dimmed canvas, no scrim box -->
<div id="s-welcome" class="screen active">
  <div class="welcome-inner">
    <p class="t1" style="font-size:1.1rem;margin-bottom:2rem;opacity:.9">LateLetter</p>
    <div id="drop-zone" role="button" tabindex="0"
         aria-label="Drop .lateletter file or press Enter to browse">
      <p class="t2">drop a <span style="opacity:1">.lateletter</span> file here</p>
      <p class="t3" style="margin-top:.5rem">
        or <button class="btn hi" id="btn-browse" type="button"
            style="font-size:.75rem">browse files</button></p>
    </div>
    <input type="file" id="file-input" accept=".lateletter,.json">
  </div>
</div>

<!-- Passphrase -->
<div id="s-passphrase" class="screen">
  <div class="scrim">
    <p class="t1 pp-title" id="pp-title">Letters from —</p>
    <p class="t3 pp-sub">enter the passphrase to continue</p>
    <div class="warn-st t4" id="warn-st">browser storage unavailable — read history will not be saved</div>
    <p class="t3 pp-label">passphrase</p>
    <input class="fi" type="password" id="pp-input"
           autocomplete="off" spellcheck="false" autocorrect="off" autocapitalize="off">
    <p class="t4 pp-hint" id="pp-hint"></p>
    <p class="pp-err" id="pp-err">incorrect passphrase, or file modified</p>
    <p class="pp-info" id="pp-info">unlocking…</p>
    <div class="btn-row">
      <button class="btn hi" id="btn-unlock">unlock</button>
      <button class="btn"    id="btn-pp-back">back</button>
    </div>
  </div>
</div>

<!-- Status -->
<div id="s-status" class="screen">
  <div class="scrim">
    <p class="t1 st-h"   id="st-h"></p>
    <p class="t3 st-sub" id="st-sub"></p>
    <div class="btn-row" id="st-btns"></div>
  </div>
</div>

<!-- Letter select -->
<div id="s-select" class="screen">
  <div class="scrim">
    <p class="t2" style="margin-bottom:1.1rem">letters waiting</p>
    <ul class="pick-list" id="pick-list"></ul>
    <div class="btn-row"><button class="btn" id="btn-sel-back">← back</button></div>
  </div>
</div>

<!-- Reading -->
<div id="s-reading" class="screen">
  <div class="scrim">
    <p class="t3 lm-from"  id="lm-from"></p>
    <p class="t1 lm-label" id="lm-label"></p>
    <p class="t4 lm-date"  id="lm-date"></p>
    <div class="letter-body" id="letter-body" tabindex="0" role="article"></div>
    <div class="la btn-row">
      <button class="btn" id="btn-save">save</button>
      <button class="btn" id="btn-all">all letters</button>
      <button class="btn hi" id="btn-rd-back">← back</button>
    </div>
  </div>
</div>

<!-- Archive -->
<div id="s-archive" class="screen">
  <div class="scrim">
    <p class="t2 arc-title" id="arc-title"></p>
    <div id="arc-content"></div>
    <p class="arc-foot" id="arc-foot">all letters delivered.</p>
    <div class="btn-row" style="margin-top:1.5rem">
      <button class="btn" id="btn-arc-back">← back to garden</button>
    </div>
  </div>
</div>

<!-- Error -->
<div id="s-error" class="screen">
  <div class="scrim">
    <p class="t2 err-h" id="err-h">something went wrong</p>
    <p class="t4 err-d" id="err-d"></p>
    <div class="btn-row" style="justify-content:center">
      <button class="btn hi" onclick="location.reload()">start over</button>
    </div>
  </div>
</div>

<!-- Memory modal -->
<div id="modal-mem" role="dialog" aria-modal="true" aria-hidden="true">
  <div class="mem-inner">
    <p class="t3 mem-type" id="mem-type"></p>
    <p class="mem-text" id="mem-text"></p>
    <div class="btn-row"><button class="btn hi" id="btn-close-mem">close</button></div>
  </div>
</div>

<script type="module">
import { prepareWithSegments, layoutWithLines }
  from 'https://cdn.jsdelivr.net/npm/@chenglou/pretext@0.0.4/+esm';

// ═══════════════════════════════════════════════════════════════════
//  GARDEN ENGINE
// ═══════════════════════════════════════════════════════════════════

// Palette C plant/sky colors — UI text is #ddd5c0 at opacity, NOT in here
const C = {
  sky:           '#050810',
  ground:        '#2e2010',
  dim_green:     '#141008',
  green:         '#4a7030',
  bright_green:  '#62923e',
  brown:         '#7a5830',
  bright_white:  '#ddd5c0',
  white:         '#b8b098',
  yellow:        '#8a6418',
  bright_yellow: '#c09428',
  red:           '#883830',
  bright_red:    '#b85038',
  cyan:          '#246858',
  bright_cyan:   '#329878',
  magenta:       '#702468',
  bright_magenta:'#a03888',
  gray:          '#484038',
  dim:           '#242018',
  flash:         '#ffffff',
};

const FONT = '13px "Courier New"';
let CW = 8, CH = 15;

// ── RNG (sfc32) ──────────────────────────────────────────────────────
class RNG {
  constructor(seed) {
    seed = seed >>> 0;
    const h = x => { x ^= x>>16; x = Math.imul(x,0x45d9f3b)>>>0; x ^= x>>16; return x>>>0; };
    this._a=h(seed); this._b=h(seed+1); this._c=h(seed+2); this._d=h(seed+3);
    for (let i=0;i<20;i++) this.random();
  }
  random() {
    let a=this._a,b=this._b,c=this._c,d=this._d;
    const t=(a+b|0)+d|0; this._d=d+1|0; this._a=b^(b>>>9);
    this._b=(c+(c<<3))|0; this._c=(c<<21|c>>>11); this._c=this._c+t|0;
    return(t>>>0)/4294967296;
  }
  randint(a,b)  { return a+Math.floor(this.random()*(b-a+1)); }
  choice(arr)   { return arr[Math.floor(this.random()*arr.length)]; }
  choices(arr,w){ let r=this.random()*w.reduce((s,x)=>s+x,0);
    for(let i=0;i<arr.length;i++){r-=w[i];if(r<=0)return arr[i];}
    return arr[arr.length-1]; }
  uniform(a,b)  { return a+this.random()*(b-a); }
}

// ── ScreenBuffer ─────────────────────────────────────────────────────
class ScreenBuffer {
  constructor(rows,cols) {
    this.rows=rows; this.cols=cols;
    const n=rows*cols;
    this._ch=new Array(n).fill(' '); this._col=new Array(n).fill('sky');
  }
  clear(){ this._ch.fill(' '); this._col.fill('sky'); }
  put(r,c,ch,col){
    if(r<0||r>=this.rows||c<0||c>=this.cols)return;
    const i=r*this.cols+c; this._ch[i]=ch; this._col[i]=col;
  }
  putStr(r,c,text,col){ for(let i=0;i<text.length;i++)this.put(r,c+i,text[i],col); }
}

// ── GardenState ──────────────────────────────────────────────────────
class GardenState {
  constructor(cols,rows,seed,season){
    this.cols=cols; this.rows=rows; this.seed=seed; this.season=season;
    this.groundY=rows-3; this.frame=0; this.wind=0; this.dt=0.05;
    this.postComplete=false;
    this.collisionMap=new Set(); this.topSurfaces={}; this.canopyCells=new Set();
    this.mouseRow=-1; this.mouseCol=-1;
  }
}

// ── Plant generators ─────────────────────────────────────────────────
function pPine(rng){
  const h=rng.randint(8,16),lvls=h-2;
  const rows=[[1,0,'|','brown'],[2,0,'|','brown']];
  for(let lv=0;lv<lvls;lv++){
    const dy=3+lv,w=lv;
    if(lv===lvls-1){rows.push([dy,0,'^','bright_green']);}
    else{const tip=lv%2?'*':'^',s='/'.repeat(w+1)+tip+'\\'.repeat(w+1);
      rows.push([dy,-(w+1),s,lv>=lvls/2?'bright_green':'green']);}
  }
  return{type:'pine',rows,width:lvls*2+2,height:h+1};
}
function pOak(rng){
  const h=rng.randint(8,14),th=Math.max(2,h/3|0);
  const ch=rng.choice(['@','o','0','&']),rows=[];
  for(let i=1;i<=th;i++)rows.push([i,0,'|','brown']);
  const cr=h-th,rad=(cr/2|0)+1;
  for(let lv=0;lv<=cr+1;lv++){
    const dy=th+lv+1,t=(lv/(cr+1))*2-1;
    const w=Math.max(0,Math.round(rad*Math.sqrt(Math.max(0,1-t*t))));
    if(!w)continue;
    rows.push([dy,-w,ch.repeat(w*2+1),(lv>0&&lv<=cr)?'bright_green':'green']);
  }
  return{type:'oak',rows,width:rad*2+3,height:h+3};
}
function pBush(rng){
  const w=rng.randint(2,4),ch=rng.choice(['~','u','w','v']);
  return{type:'bush',rows:[
    [2,-(w+1),'('+ch.repeat(w*2+1)+')','bright_green'],
    [1,-w,'{'+ch.repeat(w*2-1)+'}','green']],width:w*2+4,height:2};
}
function pFlower(rng){
  const sp=rng.choice(['daisy','tulip','sunflower','wildflower','rose']);
  const sh=rng.randint(2,5),rows=[];
  for(let i=1;i<=sh;i++)rows.push([i,0,'|','green']);
  if(sh>=2){const ly=rng.randint(1,sh-1),sd=rng.choice(['left','right','both','none','none']);
    if(sd==='left'||sd==='both')rows.push([ly,-1,'\\','green']);
    if(sd==='right'||sd==='both')rows.push([ly,1,'/','green']);}
  const bh=sh+1;let w=3;
  if(sp==='daisy'){const c=rng.choice(['white','bright_white','cyan','bright_cyan']);
    rows.push([bh+1,-1,'\\*/',c],[bh,-1,'-O-','bright_yellow']);}
  else if(sp==='tulip'){const c=rng.choice(['red','magenta','bright_magenta','bright_red']);
    rows.push([bh+1,-1,'(")',c],[bh,-1,'|"|',c]);}
  else if(sp==='sunflower'){rows.push([bh+1,-2,'\\{O}/','bright_yellow'],[bh,-1,'{#}','yellow']);w=5;}
  else if(sp==='wildflower'){const c=rng.choice(['magenta','bright_magenta','cyan','bright_cyan','bright_white']);
    rows.push([bh+1,0,'*',c],[bh,-1,'>*<',c]);}
  else{const c=rng.choice(['red','bright_magenta','bright_red']);
    rows.push([bh+1,-1,'@@@',c],[bh,-1,'(@)',c]);}
  return{type:'flower',species:sp,rows,width:w,height:bh+2};
}
function pGrass(rng){
  const h=rng.randint(2,4),tip=rng.choice(['/','\\','`',"'"]);
  const rows=[[h,0,tip,'bright_green']];
  for(let i=1;i<h;i++)rows.push([i,0,'|','green']);
  return{type:'grass',rows,width:1,height:h};
}
function pMushroom(rng){
  const w=rng.randint(1,2),c=rng.choice(['red','bright_red','yellow','bright_white','magenta']);
  return{type:'mushroom',rows:[[2,-w,'('+'~'.repeat(w*2)+') ',c],[1,0,'|','white']],width:w*2+2,height:2};
}
function pFern(rng){
  const h=rng.randint(2,4),rows=[[h+1,0,'*','bright_green']];
  for(let i=1;i<=h;i++){rows.push([i,0,'|','green']);
    const lc=i%2?'bright_green':'green';
    rows.push([i,-1,i%2?'*':',',lc],[i,1,i%2?'*':',',lc]);}
  return{type:'fern',rows,width:3,height:h+1};
}

const AUTUMN_COLS=['yellow','bright_yellow','red','brown'];
const DECIDUOUS=new Set(['oak','bush']);
function applyAutumn(plant,rng){
  if(!DECIDUOUS.has(plant.type))return;
  plant.rows=plant.rows.map(([dy,dx,t,c])=>[dy,dx,t,
    (c==='bright_green'||c==='green')?rng.choice(AUTUMN_COLS):c]);
}
const SEASON_W={
  spring:{pine:6,oak:6,bush:8,flower:30,grass:15,mushroom:2,fern:5},
  summer:{pine:8,oak:8,bush:8,flower:18,grass:12,mushroom:3,fern:7},
  autumn:{pine:10,oak:10,bush:6,flower:4,grass:8,mushroom:5,fern:6},
  winter:{pine:15,oak:4,bush:4,flower:0,grass:4,mushroom:2,fern:3},
};
const DEFAULT_W={pine:8,oak:8,bush:8,flower:18,grass:12,mushroom:3,fern:7};
const MAKERS={pine:pPine,oak:pOak,bush:pBush,flower:pFlower,
              grass:pGrass,mushroom:pMushroom,fern:pFern};
function makePlant(rng,ptype,weights,season){
  if(!ptype){const w=weights||DEFAULT_W;ptype=rng.choices(Object.keys(w),Object.values(w));}
  const p=MAKERS[ptype](rng);
  if(season==='autumn')applyAutumn(p,rng);
  return p;
}
function genLayout(cols,rows,seed,weights,season){
  const rng=new RNG(seed),gy=rows-3,placed=[],occ=[];
  for(let _=0;_<cols*3;_++){
    const p=makePlant(rng,null,weights,season);
    const half=(p.width>>1)+2;
    if(cols<half*2+4)continue;
    const x=rng.randint(half+1,cols-half-2);
    const xmin=x-half-1,xmax=x+half+1;
    if(occ.some(([mn,mx])=>xmin<mx&&xmax>mn))continue;
    occ.push([xmin,xmax]);
    placed.push({plant:p,x,gy});
  }
  return placed;
}
const CANOPY=new Set(['pine','oak']);
function buildCollision(placed){
  const col=new Set(),top={},can=new Set();
  for(const{plant,x,gy}of placed){
    const isC=CANOPY.has(plant.type);
    for(const[dy,dx,text]of plant.rows){
      const row=gy-dy;
      for(let i=0;i<text.length;i++){
        if(text[i]===' ')continue;
        const c=x+dx+i,key=`${row},${c}`;
        col.add(key);
        if(top[c]===undefined||row<top[c])top[c]=row;
        if(isC&&dy>=3)can.add(key);
      }
    }
  }
  return{col,top,can};
}

// ── BackgroundLayer ───────────────────────────────────────────────────
const GND=',~.^,.,~^,.,~,.^,~.,';
class BackgroundLayer{
  render(buf,state){
    const{cols,groundY:gy}=state;
    for(let c=0;c<cols;c++){
      buf.put(gy,  c,GND[c%GND.length],'ground');
      buf.put(gy+1,c,GND[(c+5)%GND.length],'dim_green');
    }
  }
}

// ── Rustle helpers ────────────────────────────────────────────────────
const RUSTLE_A = {'@':'o','o':'0','0':'@','&':'@','*':'.', '^':'*',
                  '~':'`','u':'v','v':'u','w':'~','(':'<',')':'>'};
const RUSTLE_B = {'@':'0','o':'@','0':'o','&':'o','*':',', '^':'`',
                  '~':'v','u':'~','v':'w','w':'u'};
const RUSTLE_ELIGIBLE = new Set('@o0&*^~uvw');

function rustleChar(ch, intensity, frameSeed) {
  if (!RUSTLE_ELIGIBLE.has(ch)) return ch;
  const n = Math.sin(frameSeed) * intensity;
  if (n > 0.45) return RUSTLE_A[ch] || ch;
  if (n < -0.45) return RUSTLE_B[ch] || ch;
  return ch;
}

// ── PlantLayer ────────────────────────────────────────────────────────
class PlantLayer {
  constructor(){ this.placed=[]; }
  regenerate(state){
    const w=SEASON_W[state.season]||DEFAULT_W;
    this.placed=genLayout(state.cols,state.rows,state.seed,w,state.season);
    const{col,top,can}=buildCollision(this.placed);
    state.collisionMap=col; state.topSurfaces=top; state.canopyCells=can;
  }
  render(buf,state){
    const mr=state.mouseRow, mc=state.mouseCol;
    const RADIUS=5, R2=RADIUS*RADIUS;
    for(const{plant,x,gy}of this.placed){
      for(const[dy,dx,text,color]of plant.rows){
        const row=gy-dy, baseCol=x+dx;
        for(let i=0;i<text.length;i++){
          let ch=text[i];
          const col=baseCol+i;
          // Cursor rustle
          if(mr>=0&&ch!==' '){
            const dr=row-mr, dc=col-mc, d2=dr*dr+dc*dc;
            if(d2<R2){
              const intensity=(1-Math.sqrt(d2)/RADIUS)*1.2;
              ch=rustleChar(ch,intensity,state.frame*0.4+col*1.9+row*2.7);
            }
          }
          buf.put(row,col,ch,color);
        }
      }
    }
  }
}

// ── ParticleLayer ─────────────────────────────────────────────────────
class Particle{
  constructor(kind,x,y,vx,vy,ch,color,maxAge){
    this.kind=kind;this.x=x;this.y=y;this.vx=vx;this.vy=vy;
    this.ch=ch;this.color=color;this.age=0;this.maxAge=maxAge;
    this.phase=Math.random()*6.28;this.amp=0.3+Math.random()*0.7;
  }
}
class ParticleLayer{
  constructor(){this._p=[];this._rng=new RNG(Date.now()&0xffffffff);this._t=0;}
  reset(){this._p=[];}
  update(state){
    this._t++;
    if(this._t%2===0)this._spawn(state);
    const kill=[];
    for(let i=0;i<this._p.length;i++){
      const p=this._p[i];p.age++;
      if(p.kind==='rain'){
        p.x+=p.vx+state.wind*0.4;p.y+=p.vy;
        const r=p.y|0,c=p.x|0;
        if(r>=state.groundY||state.collisionMap.has(`${r},${c}`))kill.push(i);
      }else if(p.kind==='snow'){
        p.x+=p.amp*Math.sin(0.03*state.frame+p.phase)*0.25;p.y+=p.vy;
        const c=Math.round(p.x),top=state.topSurfaces[c];
        if((p.y|0)>=(top!==undefined?top:state.groundY))kill.push(i);
      }else if(p.kind==='leaf'){
        p.vx+=state.wind*0.04;p.vy+=0.04;
        p.x+=p.vx;p.y+=p.vy*0.4;
        if((p.y|0)>=state.groundY)kill.push(i);
      }
      if(p.age>p.maxAge||p.x<0||p.x>=state.cols||p.y<0)kill.push(i);
    }
    if(kill.length){const ks=new Set(kill);this._p=this._p.filter((_,i)=>!ks.has(i));}
  }
  _spawn(state){
    const rng=this._rng,s=state.season;
    if((s==='spring'||s==='autumn')&&this._p.filter(p=>p.kind==='rain').length<100){
      const n=s==='autumn'?3:1;
      for(let i=0;i<n;i++)this._p.push(new Particle('rain',
        rng.random()*state.cols,0,state.wind*0.2,rng.uniform(0.7,1.4),
        rng.choice(['|','|','\\']),'cyan',35));
    }
    if(s==='winter'&&this._p.filter(p=>p.kind==='snow').length<70)
      this._p.push(new Particle('snow',rng.random()*state.cols,0,0,
        rng.uniform(0.08,0.25),rng.choice(['.','*','.']),'bright_white',300));
    if(s==='autumn'&&state.canopyCells.size>0&&this._p.filter(p=>p.kind==='leaf').length<25){
      const arr=Array.from(state.canopyCells);
      const[r,c]=arr[Math.floor(rng.random()*arr.length)].split(',').map(Number);
      this._p.push(new Particle('leaf',c,r,rng.uniform(-0.2,0.2),
        rng.uniform(0.05,0.2),rng.choice([',','\'','~','*']),
        rng.choice(['yellow','bright_yellow','red','brown']),150));
    }
  }
  spawnAt(mr,mc,state){
    // Spawn leaves from plant cells near the cursor click
    const rng=new RNG(Date.now()&0xffffffff);
    let n=0;
    for(let dr=-4;dr<=4&&n<10;dr++){
      for(let dc=-6;dc<=6&&n<10;dc++){
        const key=`${mr+dr},${mc+dc}`;
        if(state.collisionMap.has(key)){
          const leafR=mr+dr,leafC=mc+dc;
          const col=rng.choice(['bright_green','green','bright_yellow','yellow','bright_magenta']);
          this._p.push(new Particle('leaf',leafC,leafR,
            rng.uniform(-0.5,0.5),rng.uniform(-0.3,0.1),
            rng.choice([',','\'','~','*','.']),col,100));
          n++;
        }
      }
    }
  }
  render(buf,state){
    for(const p of this._p){buf.put(p.y|0,p.x|0,p.ch,p.color);}
  }
}

// ── CreatureLayer ─────────────────────────────────────────────────────
class CreatureLayer{
  constructor(){this._cr=[];this._birdT=0;this._init=false;}
  reset(){this._cr=[];this._init=false;this._birdT=0;}
  _initCreatures(state){
    this._init=true;
    const rng=new RNG(state.seed^0x12ab34cd),s=state.season;
    if(s==='spring'||s==='summer'){
      const n=rng.randint(1,2);
      for(let i=0;i<n;i++){
        const x=rng.randint(5,state.cols-5),y=rng.randint(3,state.groundY-8);
        this._cr.push({kind:'butterfly',x,y,vx:rng.random()>.5?.3:-.3,
          phase:rng.random()*6.28,color:rng.choice(['bright_magenta','magenta','bright_cyan','cyan']),
          frames:['><','||','><','\\/'],fi:0,active:true});
      }
    }
    if(s==='summer'){
      const n=rng.randint(3,5);
      for(let i=0;i<n;i++){
        const x=rng.randint(3,state.cols-3),y=rng.randint(state.groundY-12,state.groundY-3);
        this._cr.push({kind:'firefly',x,y,vx:(i%3-1)*0.04,
          vy:i%2?0.02:-0.02,phase:i*0.7,on:3+(i%5),off:10+(i%15),active:true});
      }
    }
  }
  update(state){
    if(!this._init)this._initCreatures(state);
    const gy=state.groundY;
    for(const c of this._cr){
      if(!c.active)continue;
      if(c.kind==='butterfly'){
        c.fi=Math.floor(state.frame/6)%c.frames.length;
        c.x+=c.vx;c.y+=0.15*Math.sin(state.frame*0.05+c.phase);
        c.y=Math.max(2,Math.min(gy-5,c.y));
        if(c.x<1){c.x=1;c.vx=Math.abs(c.vx);}
        if(c.x>state.cols-3){c.x=state.cols-3;c.vx=-Math.abs(c.vx);}
      }else if(c.kind==='bird'){
        c.fi=Math.floor(state.frame/8)%2;c.x+=c.vx;
        if(c.x<-3||c.x>state.cols+3)c.active=false;
      }else if(c.kind==='firefly'){
        c.x+=c.vx;c.y+=c.vy+0.05*Math.sin(state.frame*0.02+c.phase);
        c.y=Math.max(1,Math.min(gy-2,c.y));
      }
    }
    this._cr=this._cr.filter(c=>c.active!==false);
    this._birdT++;
    if(this._birdT>250+Math.floor(Math.random()*350)&&state.season!=='winter'){
      this._birdT=0;
      const fromL=Math.random()>.5;
      this._cr.push({kind:'bird',x:fromL?-2:state.cols+2,
        y:Math.floor(Math.random()*(state.groundY-8))+2,
        vx:fromL?.45:-.45,fi:0,active:true});
    }
  }
  render(buf,state){
    for(const c of this._cr){
      if(!c.active)continue;
      const r=Math.round(c.y),col=Math.round(c.x);
      if(c.kind==='butterfly') buf.putStr(r,col,c.frames[c.fi],c.color);
      else if(c.kind==='bird') buf.put(r,col,c.fi===0?'v':'~','white');
      else if(c.kind==='firefly'){
        if(state.frame%(c.on+c.off)<c.on)buf.put(r,col,'*','bright_yellow');
      }
    }
  }
}

// ── SpecialLayer ──────────────────────────────────────────────────────
class SpecialLayer{
  render(buf,state){
    if(!state.postComplete)return;
    const cx=state.cols>>1,gy=state.groundY;
    buf.put(gy-1,cx,'|','green');
    buf.putStr(gy-2,cx-1,'(@)','bright_red');
    buf.putStr(gy-3,cx-1,'@@@','red');
    buf.put(gy-9,cx+6,'v','bright_white');
  }
}

// ── Canvas blit ───────────────────────────────────────────────────────
class GardenCanvas{
  constructor(el){
    this.el=el;this.ctx=el.getContext('2d');
    this.ctx.font=FONT;
    CW=Math.ceil(this.ctx.measureText('W').width);
    CH=Math.ceil(CW*1.85);
  }
  get cols(){ return Math.floor(this.el.width/CW); }
  get rows(){ return Math.floor(this.el.height/CH); }
  resize(){ this.el.width=window.innerWidth; this.el.height=window.innerHeight; }
  blit(buf,groundY){
    const ctx=this.ctx;
    ctx.fillStyle=C.sky; ctx.fillRect(0,0,this.el.width,this.el.height);
    if(groundY!==undefined){
      ctx.fillStyle=C.dim_green;
      ctx.fillRect(0,(groundY+2)*CH,this.el.width,this.el.height);
    }
    ctx.font=FONT; ctx.textBaseline='top';
    const grp=new Map();
    const n=buf.rows*buf.cols;
    for(let i=0;i<n;i++){
      const ch=buf._ch[i];if(ch===' ')continue;
      const color=buf._col[i];
      if(!grp.has(color))grp.set(color,[]);
      const r=(i/buf.cols)|0,c=i%buf.cols;
      grp.get(color).push(c*CW,r*CH,ch);
    }
    for(const[color,items]of grp){
      ctx.fillStyle=C[color]||'#c8c8c8';
      for(let i=0;i<items.length;i+=3)ctx.fillText(items[i+2],items[i],items[i+1]);
    }
  }
}

// ── Season ────────────────────────────────────────────────────────────
function getSeason(){
  const m=new Date().getMonth()+1;
  if(m>=3&&m<=5)return'spring';if(m>=6&&m<=8)return'summer';
  if(m>=9&&m<=11)return'autumn';return'winter';
}

// ── GardenEngine ──────────────────────────────────────────────────────
class GardenEngine{
  constructor(el){
    this.gc=new GardenCanvas(el);
    this.el=el;
    this.buf=null;this.state=null;
    this.bg=new BackgroundLayer();
    this.plants=new PlantLayer();
    this.particles=new ParticleLayer();
    this.creatures=new CreatureLayer();
    this.special=new SpecialLayer();
    this._raf=null;this._last=0;this._seed=12345;
    this._bindMouse();
  }
  _bindMouse(){
    this.el.addEventListener('mousemove',e=>{
      if(!this.state)return;
      const rect=this.el.getBoundingClientRect();
      this.state.mouseRow=Math.floor((e.clientY-rect.top)/CH);
      this.state.mouseCol=Math.floor((e.clientX-rect.left)/CW);
      // Change cursor when over a plant
      const key=`${this.state.mouseRow},${this.state.mouseCol}`;
      this.el.style.cursor=this.state.collisionMap.has(key)?'pointer':'crosshair';
    });
    this.el.addEventListener('mouseleave',()=>{
      if(this.state){this.state.mouseRow=-1;this.state.mouseCol=-1;}
      this.el.style.cursor='crosshair';
    });
    this.el.addEventListener('click',e=>{
      if(!this.state)return;
      const rect=this.el.getBoundingClientRect();
      const mr=Math.floor((e.clientY-rect.top)/CH);
      const mc=Math.floor((e.clientX-rect.left)/CW);
      this.particles.spawnAt(mr,mc,this.state);
    });
  }
  setSeed(seed){this._seed=seed;this._reset();}
  _reset(){
    this.gc.resize();
    const season=getSeason();
    this.state=new GardenState(this.gc.cols,this.gc.rows,this._seed,season);
    this.buf=new ScreenBuffer(this.gc.rows,this.gc.cols);
    this.plants.regenerate(this.state);
    this.particles.reset();this.creatures.reset();
  }
  start(){
    if(this._raf)return;
    const tick=now=>{
      this._raf=requestAnimationFrame(tick);
      if(now-this._last<50)return;
      this._last=now;this._tick();
    };
    this._raf=requestAnimationFrame(tick);
  }
  stop(){if(this._raf){cancelAnimationFrame(this._raf);this._raf=null;}}
  _tick(){
    const s=this.state;s.frame++;
    s.wind=0.5*Math.sin(s.frame*0.008);
    this.particles.update(s);this.creatures.update(s);
    this.buf.clear();
    this.bg.render(this.buf,s);
    this.plants.render(this.buf,s);
    this.particles.render(this.buf,s);
    this.creatures.render(this.buf,s);
    this.special.render(this.buf,s);
    this.gc.blit(this.buf,s.groundY);
  }
  onResize(){this._reset();}
  setPostComplete(v){if(this.state)this.state.postComplete=v;}
}

const NS='lateletter_v1_';
const SIDS=['s-welcome','s-passphrase','s-status','s-select','s-reading','s-archive','s-error'];

let bundle=null,isDevFixture=false,decoded={};
let readIds=new Set(),giftDiscovered={};
let visitCount=0,firstRun=true,postComplete=false;
let dueIdxs=[],curMsg=null,cachedPassphrase=null;
let _firstReadGuide=false;
let garden=null;

// ── Storage ───────────────────────────────────────────────────────────
let _db=null,storageOk=false;
async function storageInit(){
  try{
    _db=await new Promise((res,rej)=>{
      const r=indexedDB.open('LateLetter',1);
      r.onupgradeneeded=e=>{if(!e.target.result.objectStoreNames.contains('kv'))
        e.target.result.createObjectStore('kv');};
      r.onsuccess=e=>res(e.target.result);r.onerror=e=>rej(e.target.error);
    });storageOk=true;
  }catch(_){
    try{localStorage.setItem(NS+'_t','1');localStorage.removeItem(NS+'_t');
      storageOk=true;}catch(_2){storageOk=false;}
  }
}
async function kvGet(k){
  if(!storageOk)return null;
  if(_db)return new Promise((res,rej)=>{
    const tx=_db.transaction('kv','readonly'),r=tx.objectStore('kv').get(k);
    r.onsuccess=e=>res(e.target.result??null);r.onerror=e=>rej(e.target.error);
  });
  return localStorage.getItem(k);
}
async function kvSet(k,v){
  if(!storageOk)return;
  if(_db)return new Promise((res,rej)=>{
    const tx=_db.transaction('kv','readwrite'),r=tx.objectStore('kv').put(v,k);
    r.onsuccess=()=>res();r.onerror=e=>rej(e.target.error);
  });
  try{localStorage.setItem(k,v);}catch(_){}
}
const kRead  =(bid,mid)=>`${NS}${bid}_read_${mid}`;
const kVisits=(bid)    =>`${NS}${bid}_visits`;
const kFirst =()       =>`${NS}first_run`;
const kGift  =(bid,gid)=>`${NS}${bid}_gift_${gid}`;

// ── Worker ────────────────────────────────────────────────────────────
const WORKER_SRC=`
self.onmessage=function(e){
  var d=e.data,id=d.requestId;
  if(d.type==='dev_decode'){
    var out=[];
    for(var i=0;i<d.messages.length;i++){
      var m=d.messages[i];
      try{var bin=atob(m.ciphertext),buf=new Uint8Array(bin.length);
        for(var j=0;j<bin.length;j++)buf[j]=bin.charCodeAt(j);
        var p=JSON.parse(new TextDecoder().decode(buf));
        out.push({id:m.id,ok:true,label:p.label||'',body:p.body||''});}
      catch(err){out.push({id:m.id,ok:false,label:'',body:'[decode error: '+err.message+']'});}
    }
    self.postMessage({requestId:id,ok:true,messages:out});return;
  }
  self.postMessage({requestId:id,ok:false,error:'Real decryption not yet implemented (step 13).'});
};`;
let _wk=null,_pend=new Map(),_rid=0;
function getWorker(){
  if(!_wk){
    const b=new Blob([WORKER_SRC],{type:'application/javascript'});
    _wk=new Worker(URL.createObjectURL(b));
    _wk.onmessage=e=>{const{requestId,ok,error,...rest}=e.data,p=_pend.get(requestId);
      if(p){_pend.delete(requestId);ok?p.resolve(rest):p.reject(new Error(error||'Worker error'));}};
    _wk.onerror=e=>console.error('Worker:',e);
  }
  return _wk;
}
function wCall(type,payload){
  return new Promise((res,rej)=>{
    const id=_rid++;_pend.set(id,{resolve:res,reject:rej});
    getWorker().postMessage({type,requestId:id,...payload});
  });
}

// ── Bundle loading ────────────────────────────────────────────────────
async function loadBundle(file){
  const text=await file.text(),data=JSON.parse(text);
  if(!data||typeof data!=='object')throw new Error('Not a valid .lateletter file.');
  if(data.version!==1)throw new Error(`Unsupported version: ${data.version??'(missing)'}`);
  if(!data.bundle_id)throw new Error('Bundle missing bundle_id.');
  bundle=data;isDevFixture=!bundle.hmac;
  readIds=new Set();
  for(const m of bundle.messages||[])
    if(await kvGet(kRead(bundle.bundle_id,m.id)))readIds.add(m.id);
  const v=await kvGet(kVisits(bundle.bundle_id));
  visitCount=v?(parseInt(v,10)||0):0;visitCount++;
  await kvSet(kVisits(bundle.bundle_id),String(visitCount));
  const fr=await kvGet(kFirst());firstRun=!fr;
  if(firstRun)await kvSet(kFirst(),'1');
  giftDiscovered={};
  for(const g of bundle.garden_gifts||[])
    giftDiscovered[g.id]=!!(await kvGet(kGift(bundle.bundle_id,g.id)));
}

// ── Auth ──────────────────────────────────────────────────────────────
async function verifyPassphrase(pp){
  if(isDevFixture){
    const r=await wCall('dev_decode',{messages:bundle.messages||[]});
    decoded={};
    for(const m of r.messages)decoded[m.id]={label:m.label,body:m.body};
    for(const g of bundle.garden_gifts||[]){
      if(!g.sentiment_ciphertext)continue;
      try{const bin=atob(g.sentiment_ciphertext),buf=new Uint8Array(bin.length);
        for(let i=0;i<bin.length;i++)buf[i]=bin.charCodeAt(i);
        g._sentiment=new TextDecoder().decode(buf);}catch(_){g._sentiment='';}
    }
    cachedPassphrase=pp;return true;
  }
  throw new Error('Real decryption not yet implemented (step 13).');
}

// ── Due logic ─────────────────────────────────────────────────────────
function computeDue(){
  const today=new Date();today.setHours(0,0,0,0);
  return(bundle.messages||[]).reduce((acc,m,i)=>{
    try{const d=new Date(m.date+'T00:00:00');if(d<=today&&!readIds.has(m.id))acc.push(i);}catch(_){}
    return acc;
  },[]);
}
function isPostComplete(){
  const msgs=bundle.messages||[];return msgs.length>0&&msgs.every(m=>readIds.has(m.id));
}

// ── Triggers ──────────────────────────────────────────────────────────
async function evalTriggers(justRead=null){
  const today=new Date();today.setHours(0,0,0,0);
  const newly=[];
  for(const g of bundle.garden_gifts||[]){
    if(giftDiscovered[g.id])continue;
    const t=g.trigger||{};let hit=false;
    if(t.type==='date')hit=new Date(t.value+'T00:00:00')<=today;
    else if(t.type==='cumulative_visits')hit=visitCount>=parseInt(t.value,10);
    else if(t.type==='post_letter'&&justRead)hit=t.value===justRead;
    if(hit){giftDiscovered[g.id]=true;await kvSet(kGift(bundle.bundle_id,g.id),'1');newly.push(g);}
  }
  return newly;
}

function showScreen(name){

  for(const id of SIDS)document.getElementById(id).classList.toggle('active',id==='s-'+name);
  document.getElementById('gc').classList.toggle('dim',name!=='garden');
  document.getElementById('hud').classList.toggle('vis',name==='garden');
}

// ── Garden / HUD ──────────────────────────────────────────────────────
function showGarden(){
  garden.setPostComplete(postComplete);
  const name=bundle?.author_name||'someone who loves you';
  document.getElementById('hud-author').textContent=`planted for you by ${name}.`;
  const btns=document.getElementById('hud-btns');btns.innerHTML='';
  const mk=(label,hi,fn)=>{
    const b=document.createElement('button');
    b.className='btn'+(hi?' hi':'');b.textContent=label;b.onclick=fn;return b;
  };
  if(postComplete){
    btns.appendChild(mk('your letters',true,showArchive));
  }else{
    const openFn=cachedPassphrase!==null?openDue:showPassphrase;
    const lbl=cachedPassphrase!==null&&dueIdxs.length>0?`open letters (${dueIdxs.length})`:'open letters';
    btns.appendChild(mk(lbl,true,openFn));
    if(cachedPassphrase!==null)btns.appendChild(mk('your letters',false,showArchive));
  }
  showScreen('garden');
}
function afterAuth(){ showGarden(); }
function openDue(){
  if(dueIdxs.length===0){
    showStatus('no letters today.','come back anytime — this garden is yours.',
      [{label:'your letters',hi:false,fn:showArchive},{label:'back to garden',hi:true,fn:showGarden}]);
    return;
  }
  if(dueIdxs.length===1)openLetter(dueIdxs[0]);
  else showLetterSelect();
}

// ── Passphrase ────────────────────────────────────────────────────────
function showPassphrase(){
  document.getElementById('pp-title').textContent=`letters from ${bundle.author_name||'someone'}`;
  const hint=bundle.passphrase_hint,hel=document.getElementById('pp-hint');
  hel.textContent=hint?`hint: ${hint}`:'';
  hel.style.display=hint?'block':'none';
  document.getElementById('pp-err').classList.remove('on');
  document.getElementById('pp-info').classList.remove('on');
  document.getElementById('pp-input').value='';
  document.getElementById('warn-st').classList.toggle('on',!storageOk);
  showScreen('passphrase');
  setTimeout(()=>document.getElementById('pp-input').focus(),80);
}
async function handleUnlock(){
  const inp=document.getElementById('pp-input'),btn=document.getElementById('btn-unlock');
  const errEl=document.getElementById('pp-err'),infoEl=document.getElementById('pp-info');
  errEl.classList.remove('on');
  infoEl.textContent=isDevFixture?'unlocking… (dev fixture)':'unlocking…';
  infoEl.classList.add('on');inp.disabled=btn.disabled=true;
  try{
    await verifyPassphrase(inp.value);
    await evalTriggers(null);
    postComplete=isPostComplete();dueIdxs=computeDue();
    afterAuth();
  }catch(err){
    errEl.textContent=isDevFixture?`error: ${err.message}`:'incorrect passphrase, or file modified';
    errEl.classList.add('on');infoEl.classList.remove('on');
    inp.disabled=btn.disabled=false;inp.focus();
  }
}

// ── Status ────────────────────────────────────────────────────────────
function showStatus(h,sub,btns=[]){
  document.getElementById('st-h').textContent=h;
  document.getElementById('st-sub').textContent=sub;
  const el=document.getElementById('st-btns');
  el.innerHTML=btns.map((b,i)=>`<button class="btn${b.hi?' hi':''}" data-i="${i}">${esc(b.label)}</button>`).join('');
  btns.forEach((b,i)=>el.querySelector(`[data-i="${i}"]`).onclick=b.fn);
  showScreen('status');
}

// ── Letter select ─────────────────────────────────────────────────────
function showLetterSelect(){
  const list=document.getElementById('pick-list');
  list.innerHTML=dueIdxs.map(idx=>{
    const m=bundle.messages[idx];
    return`<li><button class="pick-btn" data-idx="${idx}">${esc(fmtDate(m.date))}</button></li>`;
  }).join('');
  list.querySelectorAll('button').forEach(b=>b.onclick=()=>openLetter(parseInt(b.dataset.idx,10)));
  showScreen('select');
}

// ── Open letter ───────────────────────────────────────────────────────
async function openLetter(msgIdx){
  const msg=bundle.messages[msgIdx],dec=decoded[msg.id]||{label:'',body:''};
  curMsg={msg,...dec};
  _firstReadGuide=firstRun&&readIds.size===0;
  if(!readIds.has(msg.id)){
    readIds.add(msg.id);
    dueIdxs=dueIdxs.filter(i=>bundle.messages[i].id!==msg.id);
    await kvSet(kRead(bundle.bundle_id,msg.id),'1');
  }
  await evalTriggers(msg.id);
  postComplete=isPostComplete();
  showReading(curMsg);
}

// ── Reading ───────────────────────────────────────────────────────────
function showReading({msg,label,body}){
  const name=bundle.author_name||'someone';
  const dev=isDevFixture?'<span class="dev-b">dev</span>':'';
  document.getElementById('lm-from').innerHTML=`from ${esc(name)}${dev}`;
  document.getElementById('lm-label').textContent=label||'';
  document.getElementById('lm-date').textContent=fmtDate(msg.date);
  showScreen('reading');
  window.scrollTo(0,0);
  const bodyEl=document.getElementById('letter-body');
  bodyEl.scrollTop=0;
  renderBody(body||'',bodyEl);
  setupResize(bodyEl);
}

// ── Archive ───────────────────────────────────────────────────────────
function showArchive(){
  document.getElementById('arc-title').textContent=`letters from ${bundle.author_name||'someone'}`;
  buildArchive();
  document.getElementById('arc-foot').style.display=postComplete?'block':'none';
  showScreen('archive');
}
function buildArchive(){
  const msgs=bundle.messages||[],gifts=bundle.garden_gifts||[];
  const today=new Date();today.setHours(0,0,0,0);
  let html='<ul class="arc-list">';
  for(const msg of msgs){
    const isRead=readIds.has(msg.id),due=new Date(msg.date+'T00:00:00')<=today;
    let mk,mc,lbl,canOpen;
    if(isRead){mk='✓';mc='read';canOpen=true;lbl=decoded[msg.id]?.label||fmtDate(msg.date);}
    else if(due){mk='·';mc='unread';canOpen=true;lbl=fmtDate(msg.date);}
    else{mk='◻';mc='locked';canOpen=false;lbl='not yet available';}
    if(canOpen){
      html+=`<li class="arc-item"><span class="arc-mk ${mc}">${mk}</span>
        <div class="arc-body"><button class="arc-btn" data-mid="${esc(msg.id)}">
          <span class="arc-lbl">${esc(lbl)}</span>
          ${isRead?'':`<span class="arc-sub">${esc(fmtDate(msg.date))}</span>`}
        </button></div></li>`;
    }else{
      html+=`<li class="arc-item"><span class="arc-mk ${mc}" style="opacity:.2">${mk}</span>
        <div class="arc-body"><span class="arc-lbl" style="opacity:.2">${esc(fmtDate(msg.date))}</span>
        <span class="arc-sub">${esc(lbl)}</span></div></li>`;
    }
  }
  html+='</ul>';
  if(gifts.length>0){
    html+='<p class="t4 arc-st">memories</p><ul class="arc-list">';
    for(const g of gifts){
      const disc=giftDiscovered[g.id];
      if(disc){
        html+=`<li class="arc-item"><span class="arc-mk" style="opacity:.6">✦</span>
          <div class="arc-body"><button class="arc-btn" data-gid="${esc(g.id)}">
            <span class="arc-lbl">${esc(giftLabel(g.type))}</span>
          </button></div></li>`;
      }else{
        html+=`<li class="arc-item"><span class="arc-mk" style="opacity:.1">·</span>
          <div class="arc-body"><span class="arc-lbl" style="opacity:.1">·</span></div></li>`;
      }
    }
    html+='</ul>';
  }
  const cont=document.getElementById('arc-content');cont.innerHTML=html;
  cont.querySelectorAll('[data-mid]').forEach(btn=>{
    btn.onclick=()=>{
      const msg=(bundle.messages||[]).find(m=>m.id===btn.dataset.mid);if(!msg)return;
      const d=new Date(msg.date+'T00:00:00');d.setHours(0,0,0,0);
      const t=new Date();t.setHours(0,0,0,0);
      if(d>t){alert(`this letter arrives on ${fmtDate(msg.date)}.`);return;}
      openLetter(bundle.messages.indexOf(msg));
    };
  });
  cont.querySelectorAll('[data-gid]').forEach(btn=>{
    btn.onclick=()=>{const g=(bundle.garden_gifts||[]).find(x=>x.id===btn.dataset.gid);if(g)showMemory(g);};
  });
}

// ── Memory ────────────────────────────────────────────────────────────
function showMemory(gift){
  document.getElementById('mem-type').textContent=giftLabel(gift.type);
  let s='';
  if(isDevFixture){
    s=gift._sentiment||'';
    if(!s&&gift.sentiment_ciphertext){
      try{const bin=atob(gift.sentiment_ciphertext),buf=new Uint8Array(bin.length);
        for(let i=0;i<bin.length;i++)buf[i]=bin.charCodeAt(i);
        s=new TextDecoder().decode(buf);}catch(_){}
    }
  }else{s='[encrypted — decryption in step 13]';}
  document.getElementById('mem-text').textContent=s||'(no text)';
  const m=document.getElementById('modal-mem');
  m.classList.add('open');m.setAttribute('aria-hidden','false');
  document.getElementById('btn-close-mem').focus();
}
function closeMemory(){
  const m=document.getElementById('modal-mem');
  m.classList.remove('open');m.setAttribute('aria-hidden','true');
}

// ── Pretext ───────────────────────────────────────────────────────────
const LETTER_FONT='14px "Courier New"',LETTER_LH=26;
let _resizeObs=null;
function renderBody(text,el){
  const w=el.clientWidth;if(!w)return;
  const prep=prepareWithSegments(text,LETTER_FONT,{whiteSpace:'pre-wrap'});
  const{lines}=layoutWithLines(prep,w,LETTER_LH);
  const frag=document.createDocumentFragment();
  for(const line of lines){
    const d=document.createElement('div');d.className='ll';d.textContent=line.text;
    frag.appendChild(d);
  }
  el.replaceChildren(frag);
}
function setupResize(el){
  if(_resizeObs){_resizeObs.disconnect();_resizeObs=null;}
  _resizeObs=new ResizeObserver(()=>{if(curMsg)renderBody(curMsg.body||'',el);});
  _resizeObs.observe(el);
}
function teardownResize(){if(_resizeObs){_resizeObs.disconnect();_resizeObs=null;}}

// ── Save to text ──────────────────────────────────────────────────────
function saveToText(){
  if(!curMsg||!bundle)return;
  const{msg,label,body}=curMsg;
  const safe=(bundle.author_name||'unknown').replace(/[^a-zA-Z0-9 _-]/g,'_').trim().replace(/ /g,'_');
  const lines=[`From: ${bundle.author_name||''}`,`Date: ${msg.date}`];
  if(label)lines.push(`Subject: ${label}`);
  lines.push('',body||'','');
  const blob=new Blob([lines.join('\n')],{type:'text/plain;charset=utf-8'});
  const url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download=`letter_from_${safe}_${msg.date}.txt`;a.click();
  URL.revokeObjectURL(url);
}

// ── Helpers ───────────────────────────────────────────────────────────
function fmtDate(iso){
  try{return new Date(iso+'T00:00:00').toLocaleDateString(undefined,
    {year:'numeric',month:'long',day:'numeric'});}catch(_){return iso;}
}
function giftLabel(type){return type==='nudge'?'a note':'a memory';}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
  .replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

// ── File handling ─────────────────────────────────────────────────────
async function handleFile(file){
  if(!file)return;
  try{
    await loadBundle(file);
    garden.setSeed(bundle.garden_seed||12345);
    showGarden();
  }catch(err){
    document.getElementById('err-h').textContent='could not open this file';
    document.getElementById('err-d').textContent=err.message;
    showScreen('error');
  }
}

// ── Event wiring ──────────────────────────────────────────────────────
function wire(){
  const dz=document.getElementById('drop-zone'),fi=document.getElementById('file-input');
  dz.addEventListener('dragover',e=>{e.preventDefault();dz.classList.add('over');});
  dz.addEventListener('dragleave',()=>dz.classList.remove('over'));
  dz.addEventListener('drop',e=>{e.preventDefault();dz.classList.remove('over');handleFile(e.dataTransfer.files[0]);});
  dz.addEventListener('click',e=>{if(e.target.id!=='btn-browse')fi.click();});
  dz.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();fi.click();}});
  document.getElementById('btn-browse').onclick=e=>{e.stopPropagation();fi.click();};
  fi.onchange=e=>handleFile(e.target.files[0]);

  document.getElementById('btn-unlock').onclick=handleUnlock;
  document.getElementById('btn-pp-back').onclick=showGarden;
  document.getElementById('pp-input').addEventListener('keydown',e=>{if(e.key==='Enter')handleUnlock();});

  document.getElementById('btn-sel-back').onclick=showGarden;

  document.getElementById('btn-save').onclick=saveToText;
  document.getElementById('btn-all').onclick=showArchive;
  document.getElementById('btn-rd-back').onclick=()=>{
    if(_firstReadGuide){
      _firstReadGuide=false;
      const goNext=dueIdxs.length>0?showLetterSelect:showGarden;
      showStatus('letters will arrive here on special days.','come back anytime.',
        [{label:dueIdxs.length>0?'next letter':'back to garden',hi:true,fn:goNext}]);
    }else if(dueIdxs.length>0){showLetterSelect();}
    else{showGarden();}
  };

  document.getElementById('btn-arc-back').onclick=showGarden;
  document.getElementById('btn-close-mem').onclick=closeMemory;
  document.getElementById('modal-mem').addEventListener('click',e=>{
    if(e.target===document.getElementById('modal-mem'))closeMemory();});
  document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMemory();});
  window.addEventListener('pagehide',()=>{cachedPassphrase=null;});
  window.addEventListener('resize',()=>{if(garden)garden.onResize();});
}

// ── Init ──────────────────────────────────────────────────────────────
async function init(){
  const canvas=document.getElementById('gc');
  garden=new GardenEngine(canvas);
  garden._reset();
  garden.start();
  await storageInit();
  wire();
}

init();
</script>
